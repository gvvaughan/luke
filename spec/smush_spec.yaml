before: |
  function spit(filename, content)
     local h = assert(io.open(filename, 'w'))
     h:write(content)
     h:close()
  end

  -- What `smush` writes for *args*, given the modules beneath *tmpdir*
  -- to find, as a specl Process.
  function smush(tmpdir, ...)
     return capture(function(tmpdir, ...)
        package.path = tmpdir .. '/?.lua;' .. package.path
        return require 'smush'.main {...}
     end, tmpdir, ...)
  end

specify smush:
- describe a bundle of modules:
  - before: |
      tmpdir = os.tmpname()
      os.remove(tmpdir)
      assert(os.execute('mkdir ' .. tmpdir))
      spit(tmpdir .. '/one.lua', "return {name = 'one', two = require 'two'}\n")
      spit(tmpdir .. '/two.lua', "-- a comment\nreturn   'two'  -- another\n")
      spit(tmpdir .. '/three.lua', "return 'three'\n")
      spit(tmpdir .. '/four.lua', "return {three = require 'three'}\n")
      spit(tmpdir .. '/five.lua', "return {pcall(require, 'three')}\n")
      spit(tmpdir .. '/six.lua', "local _ENV = require 'two' {'two.sub.name'}\nreturn 6\n")
      spit(tmpdir .. '/seven.lua', "return {long = [[one\ntwo]], short = 'three\\nfour'}\n")
  - after: |
      os.execute('rm -rf ' .. tmpdir)

  - it finds the modules by name in the Lua path: |
      p = smush(tmpdir, '--module=one', 'one', 'two')
      expect(p).to_succeed_while_containing "bundled['one']=function()"
      expect(p).to_succeed_while_containing "bundled['two']=function()"
  - it squeezes the comments out: |
      p = smush(tmpdir, '--module=one', 'one', 'two')
      expect(p.output).not_to_contain 'comment'
  - it returns the module that was asked for: |
      p = smush(tmpdir, '--module=one', 'one', 'two')
      m = load(p.output)()
      expect(m).to_equal {name = 'one', two = 'two'}
  - it keeps the newlines and escapes in the strings that it bundles: |
      p = smush(tmpdir, '--module=seven', 'seven')
      expect(load(p.output)()).to_equal {long = 'one\ntwo', short = 'three\nfour'}
  - it bundles a file that it is given by path: |
      p = smush(tmpdir, '--module=x', tmpdir .. '/two.lua')
      expect(p).to_succeed_while_containing "two']=function()"
  - it bundles a file that it is given by path as the module that it is named: |
      p = smush(tmpdir, '--module=x', 'x=' .. tmpdir .. '/two.lua')
      expect(p).to_succeed_while_containing "bundled['x']=function()"
  - it keeps what it bundles out of package: |
      p = smush(tmpdir, '--module=one', 'one', 'two')
      load(p.output)()
      expect(package.loaded.one).to_be(nil)
      expect(package.loaded.two).to_be(nil)
      expect(package.preload.one).to_be(nil)
  - it only finds the modules that it bundles: |
      p = smush(tmpdir, '--module=four', 'four')
      expect(p.output).to_contain "return require'four'"
      expect(load(p.output)()).to_raise "no bundled module 'three'"
  - it is not fooled by a module of the same name that the host has loaded: |
      package.loaded.two = 'the host two'
      p = smush(tmpdir, '--module=one', 'one', 'two')
      expect(load(p.output)().two).to_be 'two'
  - it does not see a module that the host has loaded, unless it is external: |
      package.loaded.three = 'the host three'
      p = smush(tmpdir, '--module=five', 'five')
      expect(load(p.output)()[1]).to_be(false)
      p = smush(tmpdir, '--module=five', '--external=three', 'five')
      expect(load(p.output)()).to_equal {true, 'the host three'}
  - it exits for a module that is not in the Lua path: |
      p = smush(tmpdir, '--module=one', 'one', 'missing')
      expect(p).to_fail_while_matching 'module missing not found'
  - it writes a script that exits with the main function of a module: |
      p = smush(tmpdir, 'one', 'two')
      expect(p.output).to_match '^#!/usr/bin/env lua\n'
      expect(p.output).to_contain "os.exit(require'luke'.main(arg))"
  - it writes a script for the main function of any module: |
      p = smush(tmpdir, '--main=one', 'one', 'two')
      expect(p.output).to_contain "os.exit(require'one'.main(arg))"
  - it warns of a module that is in the Lua path, but is not bundled: |
      p = smush(tmpdir, '--module=four', 'four')
      expect(p.errout).to_contain "smush: warning: four names the module 'three', which is in the Lua path, but is not bundled\n"
  - it does not warn when every module is bundled: |
      p = smush(tmpdir, '--module=four', 'four', 'three')
      expect(p.errout).to_be ''
  - it does not warn of an optional module: |
      p = smush(tmpdir, '--module=five', 'five')
      expect(p.errout).to_be ''
  - it finds the module that a dotted name starts with: |
      p = smush(tmpdir, '--module=six', 'six', 'two')
      expect(p.errout).to_be ''
      p = smush(tmpdir, '--module=six', 'six')
      expect(p.errout).to_contain "smush: warning: six names the module 'two',"
  - it does not warn of a module that is external: |
      p = smush(tmpdir, '--module=four', '--external=three', 'four')
      expect(p.errout).to_be ''
