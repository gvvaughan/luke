before: |
  E = require 'luke.environment'
  env = E.mkenv({CC='cc'}, E.DEFAULTENV, E.SHELLENV)

  -- A fresh luke.lukefile, with luke.configure's `configure` put back
  -- as it was loaded, and a logger that records what it is told.
  function setup()
     -- Modules stay loaded between examples, so load the ones that luke.lukefile
     -- imports before faking `fatal`, or they keep the fake for good.
     require 'luke.schema'
     replace(require 'luke._base', 'fatal', Stub())
     replace(require 'luke.environment'.CONFIGENV, 'libs', '')
     local lukefile = reload 'luke.lukefile'
     local said = {}
     local L = {
        filled = {},
        dryrun = true,
        luke = {},
        log = Stub(),
        write = Stub(),
        verbose = function(...)
           said[#said + 1] = table.concat({...})
        end,
     }
     return lukefile, L, said
  end

specify luke.lukefile:
- after:
    restore()

- describe normalize:
  - it fully specifies the shorthand of a table of settings:
      lukefile = setup()
      expect(plain(lukefile.normalize {
         luke_format = 0, package = 'p', version = '1',
         modules = {{m = 'm.lua'}, {['x.y'] = {'a.c', 'b.c'}}},
      })).to_equal {
         luke_format = 0, package = 'p', version = '1',
         modules = {{m = {sources = {'m.lua'}}}, {['x.y'] = {sources = {'a.c', 'b.c'}}}},
      }
  - it leaves the table it is given as it was:
      lukefile = setup()
      settings = {luke_format = 0, modules = {{m = 'm.lua'}}}
      lukefile.normalize(settings)
      expect(plain(settings)).to_equal {luke_format = 0, modules = {{m = 'm.lua'}}}
  - it diagnoses a luke_format that this luke does not read: |
      r, err = require 'luke._base'.protected(require 'luke.lukefile'.normalize,
         {luke_format = 99, modules = {{m = 'm.lua'}}})
      expect(r).to_be(nil)
      expect(err).to_match 'bad luke_format: lukefile format 99 needs a newer luke'
  - it is what loadluke does after reading a lukefile: |
      lukefile = setup()
      fname = os.tmpname()
      f = io.open(fname, 'w')
      f:write("luke_format = 0\npackage = 'p'\nmodules = {{m = 'm.lua'}}\n")
      f:close()
      loaded = lukefile.loadluke(fname)
      os.remove(fname)
      expect(loaded).to_equal(lukefile.normalize {luke_format = 0, package = 'p', modules = {{m = 'm.lua'}}})

- describe run_templates:
  - it leaves the table it is given as it was:
      lukefile, L = setup()
      rules = {sources = {'a.lua.in', 'b.lua'}, optional = false}
      luke = {modules = OrderedMap {{mod = rules}}, ldocs = {sources = {'c.ld.in'}}}
      r = lukefile.run_templates(L, env, luke)
      expect(plain(r.modules.mod.sources)).to_equal(list('a.lua', 'b.lua'))
      expect(plain(r.ldocs.sources)).to_equal(list('c.ld'))
      expect(plain(rules.sources)).to_equal {'a.lua.in', 'b.lua'}
      expect(plain(luke.ldocs.sources)).to_equal {'c.ld.in'}
  - it keeps the other settings of each rule, whatever they are:
      lukefile, L = setup()
      luke = {modules = OrderedMap {{mod = {sources = {'a.lua'}, optional = false, defines = {'X'}}}}}
      r = lukefile.run_templates(L, env, luke)
      expect(r.modules.mod.optional).to_be(false)
      expect(plain(r.modules.mod.defines)).to_equal {'X'}
  - it needs no ldocs or modules:
      lukefile, L = setup()
      expect(lukefile.run_templates(L, env, {})).to_equal {}

- describe fill_template:
  - it returns a source without its '.in' suffix:
      lukefile, L = setup()
      expect(lukefile.fill_template(L, env, 'a.lua.in')).to_be 'a.lua'
  - it returns any other source as it is:
      lukefile, L = setup()
      expect(lukefile.fill_template(L, env, 'a.lua')).to_be 'a.lua'
  - it fills a template in the source directory of the request: |
      dir = os.tmpname()
      os.remove(dir)
      assert(os.execute("mkdir -p '" .. dir .. "/lib'"))
      h = assert(io.open(dir .. '/lib/a.lua.in', 'w'))
      h:write "return '@CC@'\n"
      h:close()
      lukefile, L = setup()
      L.dryrun, L.srcdir = false, dir
      lukefile.fill_template(L, E.mkenv({CC = 'cc'}, E.DEFAULTENV), 'lib/a.lua.in')
      h = assert(io.open(dir .. '/lib/a.lua'))
      expect(h:read '*a').to_be "return 'cc'\n"
      h:close()
      os.execute("rm -rf '" .. dir .. "'")

- describe collect_variables:
  - it names where each external dependency is, and its directories:
      lukefile = setup()
      expect(lukefile.collect_variables {external_dependencies = OrderedMap {{yaml = {}}, {pcre = {}}}}).
         to_equal {
            yaml_DIR = '/usr', yaml_BINDIR = '$yaml_DIR/bin',
            yaml_INCDIR = '$yaml_DIR/include', yaml_LIBDIR = '$yaml_DIR/lib',
            pcre_DIR = '/usr', pcre_BINDIR = '$pcre_DIR/bin',
            pcre_INCDIR = '$pcre_DIR/include', pcre_LIBDIR = '$pcre_DIR/lib',
         }
  - it finds external dependencies in any table:
      lukefile = setup()
      r = lukefile.collect_variables {a = {b = {external_dependencies = OrderedMap {{x = {}}}}}}
      expect(r.x_DIR).to_be '/usr'
  - it returns nothing for a lukefile without any:
      lukefile = setup()
      expect(lukefile.collect_variables {modules = {}}).to_equal {}

- describe run_configs:
  - it leaves function values in the lukefile as they are, uncalled:
      lukefile, L = setup()
      f = function() return 'called' end
      r = lukefile.run_configs(L, env, {custom = f, nested = {g = f}})
      expect(r.custom).to_be(f)
      expect(r.nested.g).to_be(f)
  - it returns a copy, leaving the lukefile as it was:
      lukefile, L = setup()
      luke = {nested = {a = 1}}
      r = lukefile.run_configs(L, env, luke)
      expect(r).not_to_be(luke)
      expect(r.nested).not_to_be(luke.nested)
  - it runs probes by kind, and then in the order written: |
      lukefile, L, said = setup()
      lukefile.run_configs(L, env, {
         defines = OrderedMap {
            {A = {checkprog = 'A', progs = {'sh'}}},
            {B = {checkheader = 'stdio.h'}},
            {C = {checkprog = 'C', progs = {'cat'}}},
            {D = {checkprog = 'D', progs = {'ls'}}},
         },
      })
      probed = {}
      for i = 1, #said do
         what = said[i]:match '^checking for (%S-)%.%.%.%s*$'
         if what ~= nil then probed[#probed + 1] = what end
      end
      expect(plain(probed)).to_equal {'sh', 'cat', 'ls', 'stdio.h'}
