before:
  platforms = require 'luke.platforms'

specify luke.environment:
- describe expand:
  - before:
      environment = require 'luke.environment'
      env = environment.mkenv {version = '1.0'}

  - it fills each template name: |
      expect(environment.expand(env, 'v@version@ (@version@)')).to_be 'v1.0 (1.0)'
  - it leaves text around a lone '@' alone: |
      expect(environment.expand(env, 'gary@example.com\nversion: @version@\n')).
         to_be 'gary@example.com\nversion: 1.0\n'
      expect(environment.expand(env, 'mail gary@example.com for @version@')).
         to_be 'mail gary@example.com for 1.0'

- describe mkenv:
  - before:
      mkenv = require 'luke.environment'.mkenv

  - it looks a name up in each table in turn:
      env = mkenv({A = 'a1'}, {A = 'a2', B = 'b'})
      expect(env.A).to_be 'a1'
      expect(env.B).to_be 'b'
  - it skips nils:
      expect(mkenv(nil, {A = 1}).A).to_be(1)
  - it returns nil for a name that is in none of them:
      expect(mkenv({A = 1}).MISSING).to_be(nil)
  - it searches an environment among them, in its place: |
      inner = mkenv({A = 'inner', B = 'b'})
      env = mkenv({C = 'c'}, inner, {B = 'outer', D = 'd'})
      expect({env.A, env.B, env.C, env.D}).to_equal {'inner', 'b', 'c', 'd'}
  - it has no variables of its own, whatever their names:
      env = mkenv {n = 'a name', ['1'] = 'text'}
      expect(env.n).to_be 'a name'
      expect(env['1']).to_be 'text'
  - it remembers what it finds:
      t = {A = 1}
      env = mkenv(t)
      expect(env.A).to_be(1)
      t.A = 2
      expect(env.A).to_be(1)

- describe interpolate:
  - before:
      environment = require 'luke.environment'

  - it fills each name with its value:
      env = environment.mkenv {A = 'a', B = 'b'}
      expect(environment.interpolate(env, '$A-$B')).to_be 'a-b'
  - it fills names that values bring in, until there are none: |
      env = environment.mkenv {A = '$B/a', B = '$C', C = 'z'}
      expect(environment.interpolate(env, '$A')).to_be 'z/a'
  - it fills a name that has no value with nothing:
      expect(environment.interpolate(environment.mkenv {}, 'a$X.b')).to_be 'a.b'
  - it is fatal if names refer to each other: |
      expect(capture(function()
         local E = require 'luke.environment'
         return E.interpolate(E.mkenv {A = '$B', B = '$A'}, '$A')
      end)).to_fail_with "luke: fatal: cannot expand '$A': its names refer to each other\n"

- describe shellword:
  - before:
      shellword = require 'luke.environment'.shellword

  - it leaves a plain word alone:
      expect(shellword 'lib/luke/init.lua').to_be 'lib/luke/init.lua'
  - it quotes a word with shell metacharacters: |
      expect(shellword 'a b').to_be "'a b'"
      expect(shellword '"git"').to_be [['"git"']]
      expect(shellword 'a;b').to_be "'a;b'"
  - it quotes each single quote in a word: |
      expect(shellword "it's").to_be [['it'\''s']]

- describe filter_platforms:
  - before:
      filter_platforms = platforms.filter_platforms

  - describe DEFAULTENV:
    - before:
        defines = {
           PREFIX        = '/usr/local',
           INST_LIBDIR   = '$PREFIX/lib/lua/$LUA_VERSION',
           INST_LUADIR   = '$PREFIX/share/lua/$LUA_VERSION',

           LIB_EXTENSION = 'so',
           OBJ_EXTENSION = 'o',

           INSTALL       = 'cp',
           MAKEDIRS      = 'mkdir -p',

           CFLAGS        = '-O2',
           platforms     = {
              macosx        = {
                 LIBFLAG       = '-fPIC -bundle -undefined dynamic_lookup -all_load',
              },
              LIBFLAG    = '-shared -fPIC',
           },
        }

        CANON = {
           Darwin = list('macosx', 'bsd', 'unix'),
           Linux  = list('linux', 'unix'),
        }

        ALLPLATFORMS = set('bsd', 'linux', 'macosx', 'unix')

        isplatform = function(x)
           return ALLPLATFORMS[x] ~= nil
        end

    - it sets the right defines on Darwin:
        expect(filter_platforms(defines, CANON.Darwin, isplatform)).to_equal {
           PREFIX        = '/usr/local',
           INST_LIBDIR   = '$PREFIX/lib/lua/$LUA_VERSION',
           INST_LUADIR   = '$PREFIX/share/lua/$LUA_VERSION',

           LIB_EXTENSION = 'so',
           OBJ_EXTENSION = 'o',

           INSTALL       = 'cp',
           MAKEDIRS      = 'mkdir -p',

           CFLAGS        = '-O2',
           LIBFLAG       = '-fPIC -bundle -undefined dynamic_lookup -all_load',
        }

    - it sets the right defines on Linux:
        expect(filter_platforms(defines, CANON.Linux, isplatform)).to_equal {
           PREFIX        = '/usr/local',
           INST_LIBDIR   = '$PREFIX/lib/lua/$LUA_VERSION',
           INST_LUADIR   = '$PREFIX/share/lua/$LUA_VERSION',

           LIB_EXTENSION = 'so',
           OBJ_EXTENSION = 'o',

           INSTALL       = 'cp',
           MAKEDIRS      = 'mkdir -p',

           CFLAGS        = '-O2',
           LIBFLAG       = '-shared -fPIC',
        }
