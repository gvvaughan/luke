        L = mkL {add = {'doc/api', 'lib/demo/version.lua'}}
        expect(release(L, env, build)).to_be(0)
        expect(slurp(IGNORE)).to_be '*~\n*.html\n!/demo-dev-*.rockspec\n'
    - it removes lines until nothing ignores those files: |
