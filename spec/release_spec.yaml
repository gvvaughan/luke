            IGNORE .. ':2:*.html\tdoc/api/index.html\n'}))
        L = mkL {add = {'doc/api', 'lib/demo/version.lua'}}
        expect(release(L, env, build)).to_be(0)
        expect(slurp(IGNORE)).to_be '*~\n!/demo-dev-*.rockspec\n'
    - it updates the .gitignore on the release branch, before adding the files: |
        release = setup(ignoring(passing(),
           {'lib/demo/version.lua\n'},
           {IGNORE .. ':4:/lib/demo/version.lua\tlib/demo/version.lua\n'}))
        L = mkL {add = {'doc/api', 'lib/demo/version.lua'}}
        expect(release(L, env, build)).to_be(0)
        expect(L.write[1]).to_be 'git checkout -b release-v1.0'
        expect(L.write[2]).to_be('updating ' .. IGNORE)
        expect(L.write[3]).to_be('git add -f ' .. ADDED)
    - it leaves ignore files outside the working tree alone: |
