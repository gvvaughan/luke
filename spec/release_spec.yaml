           {'lib/demo/version.lua\n', 'lib/demo/version.lua\n'},
           {'.git/info/exclude:1:/lib/demo/version.lua\tlib/demo/version.lua\n',
            '/home/me/.config/git/ignore:1:version.lua\tlib/demo/version.lua\n'}))
        L = mkL {add = {'doc/api', 'lib/demo/version.lua'}}
