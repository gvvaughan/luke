- describe rockspecs:
  - before: |
      dir = os.tmpname()
      os.remove(dir)
      assert(os.execute('mkdir ' .. dir))

      -- The development rockspec of *name* in dir, with *summary* if given,
      -- and the release rockspec made from it.
      function rockspec_of(name, summary)
         local h = assert(io.open(dir .. '/' .. name .. '-dev-1.rockspec', 'w'))
         h:write("local _MODREV, _SPECREV = 'dev', '-1'\n")
         if summary then
            h:write(string.format("description = {summary = '%s'}\n", summary))
         end
         h:close()
         return dir .. '/' .. name .. '-dev-1.rockspec', dir .. '/' .. name .. '-1.0-1.rockspec'
      end

      -- An `L` that releases 1.0 of *rock*, as `rock=` asks, or of the
      -- package, `demo`, with no *rock*, by the release table *release*.
      function mkrock(release, rock)
         local L = mkL(release)
         L.clidefs = {rock = rock}
         return L
      end
  - after: |
      os.execute('rm -rf ' .. dir)

  - context with a release table for each rockspec:
    - it releases the package, when no rock is named: |
        spec, done = rockspec_of 'demo'
        release, fatal = setup(passing(nil, {spec}, {done}))
        L = mkrock {[spec] = {}, [dir .. '/demo-rock-dev-1.rockspec'] = {}}
        expect(release(L, env, build)).to_be(0)
        expect(L.write[1]).to_be 'git checkout -b release-v1.0'
        expect(L.write[#L.write - 1]).to_contain 'git push origin master release-v1.0 v1.0\n'
        expect(slurp(done)).to_be "local _MODREV, _SPECREV = '1.0', '-1'\n"
    - it tags and branches with the name of a rock that is not the package: |
        spec, done = rockspec_of 'demo-rock'
        release, fatal = setup(passing('demo-rock', {spec}, {done}))
        L = mkrock({[dir .. '/demo-dev-1.rockspec'] = {}, [spec] = {}}, 'demo-rock')
        expect(release(L, env, build)).to_be(0)
        expect(#fatal).to_be(0)
        expect(L.write[1]).to_be 'git checkout -b release-demo-rock-v1.0'
        expect(table.concat(L.write, '\n')).to_contain "git commit -a -m 'Release demo-rock-v1.0.'"
        expect(L.write[#L.write - 1]).to_contain 'git push origin master release-demo-rock-v1.0 demo-rock-v1.0\n'
        expect(L.write[#L.write]).to_contain('luarocks upload ' .. done .. '\n')
    - it tags the package without its name, when it is named: |
        spec, done = rockspec_of 'demo'
        release, fatal = setup(passing(nil, {spec}, {done}))
        L = mkrock({[spec] = {}, [dir .. '/demo-rock-dev-1.rockspec'] = {}}, 'demo')
        expect(release(L, env, build)).to_be(0)
        expect(L.write[#L.write - 1]).to_contain 'git push origin master release-v1.0 v1.0\n'
    - it accepts the package as a rock of a release table with no rockspecs: |
        spec, done = rockspec_of 'demo'
        release, fatal = setup(passing(nil, {spec}, {done}))
        L = mkrock({rockspec = {spec}}, 'demo')
        expect(release(L, env, build)).to_be(0)
    - it checks that the branch and tag of the rock are unused: |
        spec, done = rockspec_of 'demo-rock'
        spawned = passing('demo-rock', {spec}, {done})
        spawned['git rev-parse --verify --quiet refs/tags/demo-rock-v1.0'] = list(0, '', 'abc123\n')
        release, fatal = setup(spawned)
        L = verbosely(mkrock({[spec] = {}}, 'demo-rock'))
        expect(release(L, env, build)).to_be(1)
        expect(fatal[1]).to_be 'cannot release %s: expected that %s'
        expect(L.reported[#L.reported]).to_be 'checking whether tag demo-rock-v1.0 is unused... no\n'
    - it is not stopped by a tag of the same version of another rock: |
        spec, done = rockspec_of 'demo-rock'
        spawned = passing('demo-rock', {spec}, {done})
        spawned['git rev-parse --verify --quiet refs/tags/v1.0'] = list(0, '', 'abc123\n')
        release, fatal = setup(spawned)
        expect(release(mkrock({[spec] = {}}, 'demo-rock'), env, build)).to_be(0)
    - it releases by the rules of the rock alone: |
        -- The package has a gh-pages branch to publish to, that passing()
        -- does not answer for, as the release of the rock does not.
        spec, done = rockspec_of 'demo-rock'
        release, fatal = setup(passing('demo-rock', {spec}, {done}))
        L = mkrock({[dir .. '/demo-dev-1.rockspec'] = {['gh-pages'] = GHPAGES}, [spec] = {}}, 'demo-rock')
        expect(release(L, env, build)).to_be(0)
        expect(#fatal).to_be(0)
    - it announces the rock: |
        spec, done = rockspec_of('demo-rock', 'A rock')
        release, fatal, tags = setup(passing('demo-rock', {spec}, {done}))
        release(mkrock({[spec] = {}}, 'demo-rock'), env, build)
        expect(tags[1]).to_contain 'A rock\n'
        expect(tags[1]).to_contain 'luarocks install demo-rock 1.0'
    - it diagnoses a rock that the release table does not have: |
        spec = rockspec_of 'demo'
        release, fatal = setup(passing())
        expect(release(mkrock({[spec] = {}}, 'other'), env, build)).to_be(1)
        expect(fatal[1]).to_be "cannot release %s: no rock '%s' in the release table of the lukefile"
    - it diagnoses rockspecs without the package, when no rock is named: |
        spec = rockspec_of 'demo-rock'
