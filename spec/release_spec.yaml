  - context with ignored release files:
    - before: |
        -- Git reports a .gitignore in the working tree by its relative
        -- path, so this one is beneath the source tree, which the
        -- examples run in.
        DIR = '.luke-spec-' .. os.time() .. '-' .. math.random(1e6)
        assert(os.execute('mkdir ' .. DIR))
        IGNORE = DIR .. '/.gitignore'
        local h = assert(io.open(IGNORE, 'w'))
        h:write '*~\n*.html\n/doc\n/lib/demo/version.lua\n!/demo-dev-*.rockspec\n'
        h:close()

        ADDED = 'doc/api lib/demo/version.lua'
        LSFILES = 'git ls-files --others --ignored --exclude-standard -- ' .. ADDED
        CHECK = 'git check-ignore --no-index --verbose -- doc/api/index.html lib/demo/version.lua'

        -- *r*, where successive `git ls-files` and `git check-ignore`
        -- queries answer each of *listed* and *checked* in turn.
        function ignoring(r, listed, checked)
           local n, m = 0, 0
           r[LSFILES] = function()
              n = n + 1
              return 0, '', listed[n] or ''
           end
           local function check()
              m = m + 1
              return 0, '', checked[m] or ''
           end
           r[CHECK] = check
           r['git check-ignore --no-index --verbose -- doc/api/index.html'] = check
           r['git check-ignore --no-index --verbose -- lib/demo/version.lua'] = check
           r['git add -f ' .. ADDED] = list(0, '', '')
           return r
        end
    - after: |
        os.execute('rm -rf ' .. DIR)

    - it removes each line that ignores a file the release commits: |
        release = setup(ignoring(passing(),
           {'doc/api/index.html\nlib/demo/version.lua\n'},
