before: |
  E = require 'luke.environment'
  env = E.mkenv({package = 'demo'}, E.DEFAULTENV, E.SHELLENV)

  -- *r*, where running *command* changes the result of git *query* to
  -- *result*, as checking the release again after a failure sees.
  function changes(r, command, query, result)
     local results = r[command]
     r[command] = function(worktree)
        r[query] = result
        if type(results) == 'function' then
           return results(worktree)
        end
        return unpack(results)
     end
     return r
  end

  -- The git results for a release that passes every check, and runs
  -- every command successfully, changing the repository as it goes.
  function passing()
     local r = {
        ['git status --porcelain'] = list(0, '', ''),
        ['git symbolic-ref --short HEAD'] = list(0, '', 'master\n'),
        ['git fetch --quiet origin'] = list(0, '', ''),
        ['git rev-parse refs/heads/master'] = list(0, '', 'abc123\n'),
        ['git rev-parse origin/master'] = list(0, '', 'abc123\n'),
        ['git rev-parse --verify --quiet refs/heads/release-v1.0'] = list(1, '', ''),
        ['git rev-parse --verify --quiet refs/tags/v1.0'] = list(1, '', ''),
        ["git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS] = list(0, '', ''),
        ['git checkout -b release-v1.0'] = list(0, '', ''),
        ['git rm --quiet ' .. ROCKSPEC] = list(0, '', ''),
        ['git add -f ' .. RELEASED] = list(0, '', ''),
        ['git add -f lib/demo.lua ' .. RELEASED] = list(0, '', ''),
        ["git commit -a -m 'Release v1.0.'"] = list(0, '', ''),
        ['git tag v1.0'] = list(0, '', ''),
        ['git checkout --quiet master'] = list(0, '', ''),
     }
     changes(r, "git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS,
        'git rev-parse refs/heads/master', list(0, '', 'def456\n'))
     changes(r, 'git checkout -b release-v1.0',
        'git rev-parse --verify --quiet refs/heads/release-v1.0', list(0, '', 'bcd234\n'))
     changes(r, 'git checkout -b release-v1.0',
        'git symbolic-ref --short HEAD', list(0, '', 'release-v1.0\n'))
     changes(r, 'git tag v1.0', 'git rev-parse --verify --quiet refs/tags/v1.0', list(0, '', 'bcd234\n'))
     return r
  end

  -- The results in *r*, with *branch* checked out, rather than master.
  function on_branch(r, branch)
     r['git symbolic-ref --short HEAD'] = list(0, '', branch .. '\n')
     r['git rev-parse refs/heads/master'] = nil
     r['git rev-parse refs/heads/' .. branch] = list(0, '', 'abc123\n')
     r['git rev-parse origin/master'] = nil
     r['git rev-parse origin/' .. branch] = list(0, '', 'abc123\n')
     r['git checkout --quiet master'] = nil
     r['git checkout --quiet ' .. branch] = list(0, '', '')
     return r
  end

  -- `git worktree list --porcelain` output for the release's own working
  -- tree alone.
  WORKTREES = 'worktree /src/demo\nHEAD abc123\nbranch refs/heads/master\n\n'

  -- The results in *r*, with a *branch* (gh-pages, unless given) that
  -- has a _config.yml.in *template*, and which runs every command for
  -- copying GHPAGES there successfully.
  function with_ghpages(r, template, branch)
     branch = branch or 'gh-pages'
     r['git rev-parse refs/heads/' .. branch] = list(0, '', 'fed789\n')
     r['git rev-parse origin/' .. branch] = list(0, '', 'fed789\n')
     r['git cat-file -e ' .. branch .. ':_config.yml.in'] = list(0, '', '')
     r['git worktree list --porcelain'] = list(0, '', WORKTREES)
     r['git worktree add --quiet WORKTREE ' .. branch] = function(worktree)
        os.execute("mkdir '" .. worktree .. "'")
        local h = assert(io.open(worktree .. '/_config.yml.in', 'w'))
        h:write(template)
        h:close()
        return 0, '', ''
     end
     r['if test -e _config.yml.in; then rm -rf WORKTREE/_config.yml.in && $MAKEDIRS WORKTREE && cp -R _config.yml.in WORKTREE/_config.yml.in; fi'] = list(0, '', '')
     r['rm -rf WORKTREE/api && $MAKEDIRS WORKTREE && cp -R doc/api WORKTREE/api'] = list(0, '', '')
     r['rm -rf WORKTREE/index.md && $MAKEDIRS WORKTREE && cp -R doc/demo.md WORKTREE/index.md'] = list(0, '', '')
     r["git -C WORKTREE add -A && git -C WORKTREE commit -m '" .. branch .. ": update to $package 1.0.'"] = list(0, '', '')
     changes(r, "git -C WORKTREE add -A && git -C WORKTREE commit -m '" .. branch .. ": update to $package 1.0.'",
        'git rev-parse refs/heads/' .. branch, list(0, '', 'cde345\n'))
     r['git worktree remove WORKTREE'] = function(worktree)
        os.execute("rm -rf '" .. worktree .. "'")
        return 0, '', ''
     end
     return r
  end

  -- Return a fresh release function, with luke._base.fatal stubbed out
  -- so as not to kill the spec runner, and spawn answering each command
  -- from *spawned*, or the results of calling a function there with the
  -- gh-pages worktree, along with stubs to inspect.  Commands name that
  -- worktree as WORKTREE in *spawned*.  Examples see deep
  -- copies of anything set up in `before`, so call this from each
  -- example rather than sharing stubs.
  function setup(spawned)
     local fatal = Stub()
     replace(require 'luke._base', 'fatal', fatal)

     local worktree
     replace(require 'luke.compile', 'spawn', function(env, ...)
        local command = table.concat({...}, ' ')
        worktree = worktree or command:match '^git worktree add %-%-quiet (%S+) %S+$'
        if worktree ~= nil then
           command = command:gsub(worktree:gsub('%p', '%%%0'), 'WORKTREE')
        end
        local r = spawned[command]
        assert(r ~= nil, 'unexpected command: ' .. command)
        if type(r) == 'function' then
           return r(worktree)
        end
        return unpack(r)
     end)

     local release = reload 'luke.release'.release
     return release, fatal
  end

  -- An `L` for releasing version 1.0, with *rules* as its lukefile
  -- `release` table.
  function mkL(rules)
     return {
        release = '1.0',
        verbose = Stub(),
        write = Stub(),
        luke = {package = 'demo', release = rules},
     }
  end

  -- Every NEWS file in these examples.
  NEWS = os.tmpname()

  function news(content)
     local h = assert(io.open(NEWS, 'w'))
     h:write(content)
     h:close()
     return NEWS
  end

  function slurp(fname)
     local h = io.open(fname)
     if h ~= nil then
        local s = h:read '*a'
        h:close()
        return s
     end
  end

  TODAY = os.date '%Y-%m-%d'

  -- A development rockspec, and the release rockspec made from it.
  ROCKSPEC = os.tmpname() .. '-dev-1.rockspec'
  RELEASED = ROCKSPEC:gsub('%-dev%-1%.rockspec$', '-1.0-1.rockspec')

  function rockspec(content)
     local h = assert(io.open(ROCKSPEC, 'w'))
     h:write(content)
     h:close()
     return ROCKSPEC
  end

  -- A successful build.
  function build()
     return 0
  end

  PLACEHOLDER = '# NEWS\n\n## Noteworthy changes in release ?.? (????-??-??) [?]\n\n'

  -- A lukefile `gh-pages` table, normalized as `loadluke` would.
  function ghpages(copies)
     return require 'luke.schema'.copies(copies, "release['gh-pages']")
  end

  -- A lukefile `gh-pages` table with a copied directory, a renamed file,
  -- and a template tracked on gh-pages.
  GHPAGES = ghpages {{api = 'doc/api/'}, {['index.md'] = 'doc/demo.md'}, '_config.yml.in'}

specify luke.release:
- after:
    restore()

- describe preconditions:
  - it passes a clean, up to date master: |
      release, fatal = setup(passing())
      expect(release(mkL(), env, build)).to_be(0)
      expect(#fatal).to_be(0)
  - it reports each check as it goes: |
      release, fatal = setup(passing())
      L = mkL()
      release(L, env, build)
      expect(L.verbose[1]).to_be 'checking whether '
      expect(L.verbose[#L.verbose]).to_be 'yes\n'
  - it checks the branch checked out only once: |
      release = setup(passing())
      L = mkL()
      reported = {}
      L.verbose = function(...)
         reported[#reported + 1] = table.concat {...}
      end
      release(L, env, build)
      branch_checks = {}
      for _, line in ipairs(reported) do
         if line:match 'is checked out' then
            branch_checks[#branch_checks + 1] = line
         end
      end
      expect(branch_checks).to_equal {'checking whether master is checked out... '}

  - it diagnoses a dirty working tree: |
      spawned = passing()
      spawned['git status --porcelain'] = list(0, '', ' M lukefile\n')
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)
      expect(fatal[1]).to_be 'cannot release %s: check failed: %s'
  - it stops at the first failing check: |
      spawned = passing()
      spawned['git status --porcelain'] = list(0, '', ' M lukefile\n')
      spawned['git fetch --quiet origin'] = nil
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)
  - it diagnoses a detached HEAD: |
      spawned = passing()
      spawned['git symbolic-ref --short HEAD'] = list(128, 'fatal: ref HEAD is not a symbolic ref', '')
      release, fatal = setup(spawned)
      L = mkL()
      reported = {}
      L.verbose = function(...)
         reported[#reported + 1] = table.concat {...}
      end
      expect(release(L, env, build)).to_be(1)
      expect(fatal[1]).to_be 'cannot release %s: check failed: %s'
      expect(reported).to_contain 'checking whether a branch is checked out... '
  - it diagnoses a failed fetch: |
      spawned = passing()
      spawned['git fetch --quiet origin'] = list(128, 'no origin', '')
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)
  - it diagnoses master behind or ahead of origin: |
      spawned = passing()
      spawned['git rev-parse origin/master'] = list(0, '', 'def456\n')
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)
  - it releases from the branch checked out: |
      release, fatal = setup(on_branch(passing(), 'main'))
      L = mkL()
      expect(release(L, env, build)).to_be(0)
      expect(#fatal).to_be(0)
      expect(L.write[#L.write - 1]).to_be 'git checkout --quiet main'
      expect(L.write[#L.write]).to_contain 'git push origin main release-v1.0 v1.0\n'
  - it diagnoses the branch checked out behind or ahead of origin: |
      spawned = on_branch(passing(), 'release-0.9')
      spawned['git rev-parse origin/release-0.9'] = list(0, '', 'def456\n')
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)
  - it diagnoses an existing release branch: |
      spawned = passing()
      spawned['git rev-parse --verify --quiet refs/heads/release-v1.0'] = list(0, '', 'abc123\n')
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)
  - it diagnoses an existing release tag: |
      spawned = passing()
      spawned['git rev-parse --verify --quiet refs/tags/v1.0'] = list(0, '', 'abc123\n')
      release, fatal = setup(spawned)
      expect(release(mkL(), env, build)).to_be(1)

  - context with news:
    - it passes news under a placeholder header: |
        fname = news(PLACEHOLDER .. '  - a change\n\n## Noteworthy changes in release 0.9 (2026-01-01) [stable]\n')
        release, fatal = setup(passing())
        expect(release(mkL {news = fname}, env, build)).to_be(0)
        os.remove(NEWS)
    - it diagnoses a missing news file: |
        release, fatal = setup(passing())
        expect(release(mkL {news = '/no/such/NEWS.md'}, env, build)).to_be(1)
    - it diagnoses a release header in place of the placeholder: |
        fname = news '# NEWS\n\n## Noteworthy changes in release 0.9 (2026-01-01) [stable]\n\n  - a change\n'
        release, fatal = setup(passing())
        expect(release(mkL {news = fname}, env, build)).to_be(1)
        os.remove(NEWS)
    - it diagnoses a placeholder with no news under it: |
        fname = news(PLACEHOLDER .. '\n## Noteworthy changes in release 0.9 (2026-01-01) [stable]\n\n  - old\n')
        release, fatal = setup(passing())
        expect(release(mkL {news = fname}, env, build)).to_be(1)
        os.remove(NEWS)
    - it diagnoses news that already has this release: |
        fname = news(PLACEHOLDER .. '  - a change\n\n## Noteworthy changes in release 1.0 (2026-01-01) [stable]\n')
        release, fatal = setup(passing())
        expect(release(mkL {news = fname}, env, build)).to_be(1)
        os.remove(NEWS)

  - context with gh-pages:
    - it diagnoses gh-pages behind or ahead of origin: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git rev-parse origin/gh-pages'] = list(0, '', 'abc123\n')
        release = setup(spawned)
        expect(release(mkL {['gh-pages'] = {}}, env, build)).to_be(1)
    - it diagnoses a missing gh-pages branch: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git rev-parse refs/heads/gh-pages'] = list(128, '', '')
        spawned['git rev-parse origin/gh-pages'] = list(128, '', '')
        release = setup(spawned)
        expect(release(mkL {['gh-pages'] = {}}, env, build)).to_be(1)
    - it diagnoses gh-pages checked out in another worktree: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git worktree list --porcelain'] = list(0, '', WORKTREES ..
           'worktree /src/demo-gh-pages\nHEAD fed789\nbranch refs/heads/gh-pages\n\n')
        release, fatal = setup(spawned)
        L = mkL {['gh-pages'] = GHPAGES}
        reported = {}
        L.verbose = function(...)
           reported[#reported + 1] = table.concat {...}
        end
        expect(release(L, env, build)).to_be(1)
        expect(fatal[1]).to_be 'cannot release %s: check failed: %s'
        expect(reported[#reported - 1]).to_be 'checking whether gh-pages can be checked out in a new worktree... '
    - it passes gh-pages detached in another worktree: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git worktree list --porcelain'] = list(0, '', WORKTREES ..
           'worktree /src/demo-gh-pages\nHEAD fed789\ndetached\n\n')
        release, fatal = setup(spawned)
        expect(release(mkL {['gh-pages'] = GHPAGES}, env, build)).to_be(0)
        expect(#fatal).to_be(0)
    - it diagnoses a template in neither gh-pages nor the release: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git cat-file -e gh-pages:_config.yml.in'] = list(128, 'fatal: not a valid object', '')
        release, fatal = setup(spawned)
        expect(release(mkL {['gh-pages'] = GHPAGES}, env, build)).to_be(1)
        expect(fatal[1]).to_be 'cannot release %s: check failed: %s'

  - context with a rockspec:
    - after: |
        os.remove(ROCKSPEC)
    - it diagnoses a rockspec that is not for development: |
        release = setup(passing())
        expect(release(mkL {rockspec = 'demo-1.0-1.rockspec'}, env, build)).to_be(1)
    - it diagnoses a rockspec without _MODREV on its first line: |
        rockspec "package = 'demo'\nversion = 'dev-1'\n"
        release = setup(passing())
        expect(release(mkL {rockspec = ROCKSPEC}, env, build)).to_be(1)

- describe steps:
  - before: |
      fname = news(PLACEHOLDER .. '  - a change\n\n\n## Noteworthy changes in release 0.9 (2026-01-01) [stable]\n')
  - after: |
      os.remove(NEWS)

  - it commits a release header below the placeholder on master: |
      spawned = passing()
      spawned["git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS] = function()
         committed = slurp(NEWS)
         return 0, '', ''
      end
      release = setup(spawned)
      expect(release(mkL {news = fname}, env, build)).to_be(0)
      expect(committed).to_be(PLACEHOLDER ..
         '\n## Noteworthy changes in release 1.0 (' .. TODAY .. ') [stable]\n\n' ..
         '  - a change\n\n\n## Noteworthy changes in release 0.9 (2026-01-01) [stable]\n')
  - it removes the placeholder on the release branch: |
      release = setup(passing())
      expect(release(mkL {news = fname}, env, build)).to_be(0)
      expect(slurp(NEWS)).to_be('# NEWS\n\n\n## Noteworthy changes in release 1.0 (' .. TODAY .. ') [stable]\n\n' ..
         '  - a change\n\n\n## Noteworthy changes in release 0.9 (2026-01-01) [stable]\n')
  - it writes each step as it goes: |
      release = setup(passing())
      L = mkL {news = fname}
      release(L, env, build)
      expect(L.write[1]).to_be('updating ' .. NEWS)
      expect(L.write[2]).to_be("git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS)
      expect(L.write[3]).to_be 'git checkout -b release-v1.0'
      expect(L.write[4]).to_be('updating ' .. NEWS)
  - it leaves NEWS alone without news: |
      release = setup(passing())
      L = mkL()
      expect(release(L, env, build)).to_be(0)
      expect(L.write[1]).to_be 'git checkout -b release-v1.0'
      expect(L.write[2]).to_be "git commit -a -m 'Release v1.0.'"
  - it stops at the first failing command: |
      spawned = passing()
      spawned["git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS] = list(1, '', '')
      spawned['git checkout -b release-v1.0'] = nil
      release = setup(spawned)
      expect(release(mkL {news = fname}, env, build)).to_be(1)
  - it changes nothing with --dry-run: |
      spawned = passing()
      spawned["git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS] = nil
      spawned['git checkout -b release-v1.0'] = nil
      release = setup(spawned)
      L = mkL {news = fname}
      L.dryrun = true
      before = slurp(NEWS)
      expect(release(L, env, build)).to_be(0)
      expect(slurp(NEWS)).to_be(before)
      expect(L.write[3]).to_be 'git checkout -b release-v1.0'
  - it builds after branching: |
      spawned = passing()
      spawned['git checkout -b release-v1.0'] = function()
         branched = true
         return 0, '', ''
      end
      release = setup(spawned)
      expect(release(mkL(), env, function()
         built = branched
         return 0
      end)).to_be(0)
      expect(built).to_be(true)
  - it stops when the build fails: |
      spawned = passing()
      spawned["git commit -a -m 'Release v1.0.'"] = nil
      release = setup(spawned)
      expect(release(mkL(), env, function() return 2 end)).to_be(2)
  - it does not build with --dry-run: |
      release = setup(passing())
      L = mkL()
      L.dryrun = true
      expect(release(L, env, function() error 'built' end)).to_be(0)
  - it commits and tags the release: |
      release = setup(passing())
      L = mkL()
      expect(release(L, env, build)).to_be(0)
      expect(L.write[2]).to_be "git commit -a -m 'Release v1.0.'"
      expect(L.write[3]).to_be 'git tag v1.0'
  - it returns to master, and says how to publish the release: |
      release = setup(passing())
      L = mkL()
      expect(release(L, env, build)).to_be(0)
      expect(L.write[4]).to_be 'git checkout --quiet master'
      expect(L.write[5]).to_contain 'git push origin master release-v1.0 v1.0\n'
      expect(L.write[6]).to_be(nil)
  - it says nothing about publishing a failed release: |
      release = setup(passing())
      L = mkL()
      expect(release(L, env, function() return 2 end)).to_be(2)
      expect(L.write[1]).to_be 'git checkout -b release-v1.0'
      expect(L.write[#L.write]).not_to_contain 'git push'

  - context after a failure:
    - before: |
        fname = news(PLACEHOLDER .. '  - a change\n')

    - it says nothing when nothing needs undoing: |
        spawned = passing()
        spawned['git checkout -b release-v1.0'] = list(1, '', '')
        release = setup(spawned)
        L = mkL()
        expect(release(L, env, build)).to_be(1)
        expect(L.write[2]).to_be(nil)
    - it says how to undo the NEWS commit on master: |
        spawned = passing()
        spawned['git checkout -b release-v1.0'] = list(1, '', '')
        release = setup(spawned)
        L = mkL {news = fname}
        expect(release(L, env, build)).to_be(1)
        expect(L.write[#L.write]).to_be('\nRelease v1.0 failed.  To undo it before trying again:\n\n' ..
           '   git reset --hard origin/master\n')
    - it says how to undo a NEWS edit that was not committed: |
        spawned = passing()
        spawned["git commit -m 'maint: update NEWS.md for 1.0.' " .. NEWS] = function()
           spawned['git status --porcelain'] = list(0, '', ' M ' .. NEWS .. '\n')
           return 1, '', ''
        end
        release = setup(spawned)
        L = mkL {news = fname}
        expect(release(L, env, build)).to_be(1)
        expect(L.write[#L.write]).to_be('\nRelease v1.0 failed.  To undo it before trying again:\n\n' ..
           '   git checkout --force master\n')
    - it says how to undo the release branch: |
        release = setup(passing())
        L = mkL {news = fname}
        expect(release(L, env, function() return 2 end)).to_be(2)
        expect(L.write[#L.write]).to_be('\nRelease v1.0 failed.  To undo it before trying again:\n\n' ..
           '   git checkout --force master\n' ..
           '   git reset --hard origin/master\n' ..
           '   git branch -D release-v1.0\n')
    - it says how to undo the release tag: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git worktree add --quiet WORKTREE gh-pages'] = list(1, '', '')
        release = setup(spawned)
        L = mkL {['gh-pages'] = GHPAGES}
        expect(release(L, env, build)).to_be(1)
        expect(L.write[#L.write]).to_be('\nRelease v1.0 failed.  To undo it before trying again:\n\n' ..
           '   git checkout --force master\n' ..
           '   git branch -D release-v1.0\n' ..
           '   git tag -d v1.0\n')
    - it says how to undo the gh-pages commit: |
        spawned = with_ghpages(passing(), 'release-no: @version@\n')
        spawned['git checkout --quiet master'] = list(1, '', '')
        release = setup(spawned)
        L = mkL {['gh-pages'] = GHPAGES}
        expect(release(L, env, build)).to_be(1)
        expect(L.write[#L.write]).to_be('\nRelease v1.0 failed.  To undo it before trying again:\n\n' ..
           '   git checkout --force master\n' ..
           '   git branch -D release-v1.0\n' ..
           '   git tag -d v1.0\n' ..
           '   git branch -f gh-pages origin/gh-pages\n')

  - context with gh-pages:
    - before: |
        rules = {['gh-pages'] = GHPAGES}

    - it copies each file and directory, and fills templates in place, in the order written: |
        spawned = with_ghpages(passing(), 'name: Demo\nrelease-no: @version@\n')
        spawned["git -C WORKTREE add -A && git -C WORKTREE commit -m 'gh-pages: update to $package 1.0.'"] = function(worktree)
           published = slurp(worktree .. '/_config.yml')
           return 0, '', ''
        end
        release = setup(spawned)
        L = mkL(rules)
