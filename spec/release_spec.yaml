- describe copy_command:
  - before: |
      E = require 'luke.environment'
      copy_command = reload 'luke.release'.copy_command

      -- A scratch git repository holding each of *files*, a table of
      -- paths and contents, committed; and its path.
      function repository(files)
         local repo = os.tmpname()
         os.remove(repo)
         assert(os.execute("mkdir -p '" .. repo .. "'"))
         for path, content in pairs(files) do
            os.execute("mkdir -p '" .. (repo .. '/' .. path):gsub('/[^/]*$', '') .. "'")
            local h = assert(io.open(repo .. '/' .. path, 'w'))
            h:write(content)
            h:close()
         end
         os.execute("cd '" .. repo .. "' && git init -q 2>/dev/null && git add -A && "
            .. "git -c user.name=x -c user.email=x commit -q --no-verify -m x")
         return repo
      end

      -- Run the command to copy *source* to *path* in *repo*.
      function copy(source, repo, path, optional)
         local env = E.mkenv(E.DEFAULTENV)
         return os.execute(E.interpolate(env, copy_command(source, repo, path, optional)) .. ' 2>/dev/null')
      end

      function exists(path)
         local h = io.open(path)
         return h ~= nil and h:close()
      end
  - after: |
      os.execute("rm -rf '" .. src .. "' '" .. repo .. "'")

  - it replaces a directory, removing what the release no longer has, but not templates: |
