    - before: |
        README = os.tmpname()

        function readme(content)
           local h = assert(io.open(README, 'w'))
           h:write(content)
           h:close()
           return README
        end

        BADGES = '[![ci](https://ci.example.com/o/demo/badge.svg?branch=master)]'
           .. '(https://cov.example.com/o/demo?branch=master)\n'

        -- A lukefile `replacements` table for README, normalized as
        -- `loadluke` would.
        function replacements(pairs)
           return {{[README] = pairs}}
        end

        -- *L*, collecting each line of its --verbose output in
        -- `L.reported`.
        function verbosely(L)
           L.reported, L.line = {}, ''
           L.verbose = function(...)
              L.line = L.line .. table.concat {...}
              if L.line:match '\n$' then
                 L.reported[#L.reported + 1], L.line = L.line, ''
              end
           end
           return L
        end
