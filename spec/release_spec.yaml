- describe copy_command:
  - before: |
      E = require 'luke.environment'
      copy_command = reload 'luke.release'.copy_command

      -- A scratch git repository holding each of *files*, a table of
      -- paths and contents, committed; and its path.
      function repository(files)
         local repo = os.tmpname()
         os.remove(repo)
         assert(os.execute("mkdir -p '" .. repo .. "'"))
         for path, content in pairs(files) do
            os.execute("mkdir -p '" .. (repo .. '/' .. path):gsub('/[^/]*$', '') .. "'")
            local h = assert(io.open(repo .. '/' .. path, 'w'))
            h:write(content)
            h:close()
         end
         os.execute("cd '" .. repo .. "' && git init -q 2>/dev/null && git add -A && "
            .. "git -c user.name=x -c user.email=x commit -q --no-verify -m x")
         return repo
      end

      -- Run the command to copy *source* to *path* in *repo*.
      function copy(source, repo, path, optional)
         local env = E.mkenv(E.DEFAULTENV)
         return os.execute(E.interpolate(env, copy_command(source, repo, path, optional)) .. ' 2>/dev/null')
      end

      function exists(path)
         local h = io.open(path)
         return h ~= nil and h:close()
      end
  - after: |
      os.execute("rm -rf '" .. src .. "' '" .. repo .. "'")

  - it replaces a directory, removing what the release no longer has, but not templates: |
      repo = repository {['api/old.html'] = 'old', ['api/keep.in'] = 'keep', ['index.md'] = 'index'}
      src = repository {['api/new.html'] = 'new'}
      copy(src .. '/api', repo, 'api')
      expect(exists(repo .. '/api/new.html')).to_be(true)
      expect(exists(repo .. '/api/old.html')).to_be(false)
      expect(exists(repo .. '/api/keep.in')).to_be(true)
      expect(exists(repo .. '/index.md')).to_be(true)
  - it replaces everything but templates at the root: |
      repo = repository {['index.html'] = 'old', ['modules/old.html'] = 'old', ['_config.yml.in'] = 'cfg'}
      src = repository {['index.html'] = 'new', ['modules/new.html'] = 'new'}
      copy(src, repo, '.')
      expect(exists(repo .. '/modules/new.html')).to_be(true)
      expect(exists(repo .. '/modules/old.html')).to_be(false)
      expect(exists(repo .. '/_config.yml.in')).to_be(true)
      expect(exists(repo .. '/.git')).to_be(true)
      h = io.open(repo .. '/index.html'); expect(h:read '*a').to_be 'new'; h:close()
  - it replaces a file: |
      repo = repository {['index.md'] = 'old'}
      src = repository {['doc/demo.md'] = 'new'}
      copy(src .. '/doc/demo.md', repo, 'index.md')
      h = io.open(repo .. '/index.md'); expect(h:read '*a').to_be 'new'; h:close()
  - it copies an optional path only if the release has it: |
      repo = repository {['index.md'] = 'old'}
      src = repository {['other'] = ''}
      copy(src .. '/index.md', repo, 'index.md', true)
      h = io.open(repo .. '/index.md'); expect(h:read '*a').to_be 'old'; h:close()
