before:
  cli = require 'luke.cli'

specify luke.cli:
- describe parse_arguments:
  - before:
      parse_arguments = cli.parse_arguments

  - it accepts equals signs on RHS of a define:
      argt = parse_arguments {'foo=bar=baz'}
      expect(argt.clidefs).to_equal {foo='bar=baz'}

  - it does not confuse --file=foo with defining a variable:
      argt = parse_arguments {'--file=foo', 'file=bar'}
      expect(argt.fname).to_be 'foo'
      expect(argt.clidefs).to_equal {file='bar'}

  - it spawns commands:
      expect(parse_arguments {}.spawn).to_be(require 'luke.compile'.spawn)

  - it only pretends to spawn commands with --dry-run: |
      argt = parse_arguments {'--dry-run'}
      expect(argt.dryrun).to_be(true)
      expect(list(argt.spawn({}, 'exit 1'))).to_equal(list(0, '', ''))

  - it is not quiet by default:
      argt = parse_arguments {}
      expect(argt.quiet).to_be(false)
      expect(argt.write).not_to_be(require 'luke.functional'.nop)

  - it writes nothing with --quiet:
      argt = parse_arguments {'--quiet'}
      expect(argt.quiet).to_be(true)
      expect(argt.write).to_be(require 'luke.functional'.nop)

  - it asks for each --value in order:
      expect(parse_arguments({'--value=B', '--value=A'}).valreqs).to_equal(list('B', 'A'))

  - it takes the rest as targets, in order:
      expect(parse_arguments({'b', 'a'}).targets).to_equal(list('b', 'a'))

  - it writes each line of debug output with a prefix: |
      expect(capture(function()
         require 'luke.cli'.parse_arguments({'--debug'}).log('one\ntwo\n\n\n')
      end)).to_output_error '   DEBUG: one\n   DEBUG: two\n'

- describe validate_arguments:
  - before:
      function spit(content)
         local filename = os.tmpname()
         local h = assert(io.open(filename, 'w'))
         h:write(content)
         h:close()
         return filename
      end

  - it makes substitutions for the lukefile: |
      fname = spit [[
         luke_format = 0
         package = 'example'
         version = '1.0'
         modules = {{example = 'example.lua'}}
      ]]
      L = cli.validate_arguments(cli.parse_arguments {'--file=' .. fname})
      expect(L.luke.substitute.package).to_be 'example'
      expect(L.luke.substitute.version).to_be '1.0'
      expect(L.luke.substitute.gitref).to_match '^%x*$'
  - it prefers lukefile substitutions to the ones that luke makes up: |
      fname = spit [[
         luke_format = 0
         package = 'example'
         version = '1.0'
         modules = {{example = 'example.lua'}}
         substitute = {gitref = 'mine', extra = 'more'}
      ]]
      L = cli.validate_arguments(cli.parse_arguments {'--file=' .. fname})
      expect(L.luke.substitute.gitref).to_be 'mine'
      expect(L.luke.substitute.extra).to_be 'more'
  - it passes quiet on: |
      fname = spit [[
         luke_format = 0
         package = 'example'
         version = '1.0'
         modules = {{example = 'example.lua'}}
      ]]
      expect(cli.validate_arguments(cli.parse_arguments {'--file=' .. fname, '--quiet'}).quiet).to_be(true)
      expect(cli.validate_arguments(cli.parse_arguments {'--file=' .. fname}).quiet).to_be(false)
