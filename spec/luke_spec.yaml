before: |
  -- Run luke in-process, in strict mode, with command line *...*.
  function luke(...)
     return capture(function(...)
        return require 'luke'.main {...}
     end, ...)
  end

  function spit(filename, content)
     local h = assert(io.open(filename, 'w'))
     h:write(content)
     h:close()
     return filename
  end

  function slurp(filename)
     local h = io.open(filename)
     if h ~= nil then
        local s = h:read '*a'
        h:close()
        return s
     end
  end

  -- Write *content* to a fresh lukefile, and return its name.
  function lukefile(content)
     return spit(os.tmpname(), content)
  end

specify luke:
- describe command line:
  - it prints its version: |
      expect(luke '--version').
         to_succeed_while_matching '^luke %(Luke%) [^/%s]*/%x%x%x%x%x%x%x+\n'
  - it prints help: |
      expect(luke '--help').to_succeed_while_containing 'Usage: luke'
  - it diagnoses unknown options: |
      p = luke '--no-such-option'
      expect(p).to_exit(2)
      expect(p).to_contain_error "luke: error: unrecognized option '--no-such-option'."

- describe lukefile:
  - before: |
      fname = lukefile [[
         package = 'example'
         version = '1.0'
         modules = {
            example = 'example.lua',
            other = 'other.lua',
         }
      ]]
  - after: |
      os.remove(fname)

  - it diagnoses a missing lukefile: |
      p = luke '--file=no/such/lukefile'
      expect(p).to_exit(1)
      expect(p).to_contain_error 'luke: fatal: bad no/such/lukefile'
  - it diagnoses syntax errors: |
      spit(fname, 'modules = {')
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error 'Error loading file'
  - it diagnoses runtime errors: |
      spit(fname, 'modules = nosuchfunction()')
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error 'Error running file'
  - it diagnoses a missing modules table: |
      spit(fname, "package = 'example'")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error("no modules table in '" .. fname .. "'")
  - it diagnoses a missing package or version: |
      spit(fname, "version = '1.0'\nmodules = {example = 'example.lua'}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error("no package in '" .. fname .. "'")
      spit(fname, "package = 'example'\nmodules = {example = 'example.lua'}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error("no version in '" .. fname .. "'")
  - it diagnoses unknown targets: |
      p = luke('--file=' .. fname, 'nosuchtarget')
      expect(p).to_exit(1)
      expect(p).to_contain_error "no rule to make target 'nosuchtarget'"
  - it prints lukefile values: |
      expect(luke('--file=' .. fname, '--value=package', '--value=version')).
         to_succeed_with "package='example'\nversion='1.0'\n"
  - it prefers command line values: |
      expect(luke('--file=' .. fname, 'version=2.0', '--value=version')).
         to_succeed_with "version='2.0'\n"
  - it sets gitref to the checked out commit: |
      expect(luke('--file=' .. fname, '--value=gitref')).
         to_succeed_while_matching "^gitref='%x%x%x%x%x%x%x+'\n$"
  - it expands gitref in lukefile values: |
      spit(fname, [[
         package = 'example'
         version = '$gitref'
         modules = {example = 'example.lua'}
      ]])
      expect(luke('--file=' .. fname, '--value=version')).
         to_succeed_while_matching "^version='%x%x%x%x%x%x%x+'\n$"
  - it diagnoses a malformed release table: |
      spit(fname, [[
         package = 'example'
         version = '1.0'
         modules = {example = 'example.lua'}
         release = {['gh-pages'] = {api = 42}}
      ]])
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error "bad release['gh-pages'].api: string expected, got number"
  - it diagnoses malformed modules at their path: |
      spit(fname, "modules = {['a.b'] = 42}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error "bad modules['a.b']: string or table expected, got number"
  - it accepts a single string for a list: |
      spit(fname, [[
         package = 'example'
         version = '1.0'
         modules = {example = 'example.lua'}
         release = {add = 'doc'}
      ]])
      expect(luke('--file=' .. fname, '--value=version')).to_succeed()
  - it lets keys for other tools through: |
      spit(fname, [[
         package = 'example'
         version = '1.0'
         modules = {example = 'example.lua'}
         description = {summary = 'An example'}
      ]])
      expect(luke('--file=' .. fname, '--value=version')).to_succeed()
  - it diagnoses unsupported release keys: |
      spit(fname, [[
         package = 'example'
         version = '1.0'
         modules = {example = 'example.lua'}
         release = {changelog = 'ChangeLog'}
      ]])
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error "bad release: unsupported key 'changelog'"
  - it has a row in the manual's lukefile reference for every key: |
      reference = slurp 'doc/luke.md':match '\n## %d+%. Lukefile Reference\n(.-)\n## '
      expect(reference).not_to_be(nil)
      missing = {}
      for _, k in ipairs(require 'luke.lukefile'.keypaths()) do
         if not reference:find('\n| `' .. k .. '` ', 1, true) then
            missing[#missing + 1] = k
         end
      end
      expect(missing).to_equal {}

- describe release:
  - before: |
      fname = lukefile [[
         package = 'example'
         version = '1.0'
         modules = {example = 'example.lua'}
      ]]
  - after: |
      os.remove(fname)

  - it needs a version: |
      p = luke('--file=' .. fname, 'release')
      expect(p).to_exit(1)
      expect(p).to_contain_error 'release needs a version=VERSION argument'
  - it diagnoses malformed versions: |
      p = luke('--file=' .. fname, 'release', 'version=1.0rc1')
      expect(p).to_exit(1)
      expect(p).to_contain_error "bad release version '1.0rc1': X.Y or X.Y.Z expected"
  - it cannot be combined with other targets: |
      p = luke('--file=' .. fname, 'release', 'example', 'version=1.0')
      expect(p).to_exit(1)
      expect(p).to_contain_error 'release cannot be combined with other targets'

- describe install:
  - before: |
      tmpdir = os.tmpname()
      os.remove(tmpdir)
      assert(os.execute('mkdir ' .. tmpdir))
      spit(tmpdir .. '/example.lua.in', "return '@package@ @version@'\n")
      spit(tmpdir .. '/other.lua', "return 'other'\n")
      fname = spit(tmpdir .. '/lukefile', [[
         package = 'example'
         version = '1.0'
         modules = {
            example = ']] .. tmpdir .. [[/example.lua.in',
            other = ']] .. tmpdir .. [[/other.lua',
         }
      ]])
      installed = tmpdir .. '/share/lua/' .. _VERSION:match '%d+%.%d+' .. '/'
  - after: |
      os.execute('rm -rf ' .. tmpdir)

  - it fills templates when building: |
      expect(luke('--file=' .. fname)).
         to_succeed_with('creating ' .. tmpdir .. '/example.lua\n')
      expect(slurp(tmpdir .. '/example.lua')).to_be "return 'example 1.0'\n"
  - it fills gitref in templates: |
      spit(tmpdir .. '/example.lua.in', "return '@gitref@'\n")
      expect(luke('--file=' .. fname)).to_succeed()
      expect(slurp(tmpdir .. '/example.lua')).to_match "^return '%x%x%x%x%x%x%x+'\n$"
  - it installs every module: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'install')).
         to_succeed_while_containing('cp ' .. tmpdir .. '/other.lua ' .. installed)
      expect(slurp(installed .. 'example.lua')).to_be "return 'example 1.0'\n"
      expect(slurp(installed .. 'other.lua')).to_be "return 'other'\n"
  - it makes no bin directory without scripts to install: |
      p = luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'all', 'install')
      expect(p).to_succeed()
      expect(p.output).not_to_contain('mkdir -p ' .. tmpdir .. '/bin')
  - it installs only the given targets: |
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'other', 'install')).
         to_succeed()
      expect(slurp(installed .. 'example.lua')).to_be(nil)
      expect(slurp(installed .. 'other.lua')).to_be "return 'other'\n"
  - it builds and installs everything with all: |
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'all', 'install')).
         to_succeed()
      expect(slurp(installed .. 'example.lua')).to_be "return 'example 1.0'\n"
  - it writes nothing with --quiet: |
      expect(luke('--file=' .. fname, '--quiet', 'PREFIX=' .. tmpdir, 'all', 'install')).
         to_succeed_with ''
  - it writes failing commands even with --quiet: |
      p = luke('--file=' .. fname, '--quiet', 'PREFIX=' .. tmpdir, 'install')
      expect(p).to_fail_while_containing 'example.lua'
      expect(p).to_contain_output '$INSTALL '

- describe scripts:
  - before: |
      tmpdir = os.tmpname()
      os.remove(tmpdir)
      assert(os.execute('mkdir ' .. tmpdir))
      spit(tmpdir .. '/other.lua', "return 'other'\n")
      spit(tmpdir .. '/shim.in', "#!/bin/sh\necho '@abs_top_srcdir@' '@version@'\n")
      spit(tmpdir .. '/tool', "#!/bin/sh\necho tool\n")
      spit(tmpdir .. '/helper.in', "#!/bin/sh\necho @package@\n")
      fname = spit(tmpdir .. '/lukefile', [[
         package = 'example'
         version = '1.0'
         modules = {other = ']] .. tmpdir .. [[/other.lua'}
         bin = {shim = ']] .. tmpdir .. [[/shim.in'}
         install = {
            bin = {
               tool = ']] .. tmpdir .. [[/tool',
               ']] .. tmpdir .. [[/helper.in',
            },
         }
      ]])
      bindir = tmpdir .. '/bin/'

      function isexecutable(path)
         local p = io.popen("test -x '" .. path .. "' && echo yes")
         local s = p:read '*a'
         p:close()
         return s == 'yes\n'
      end

      local p = io.popen 'pwd'
      cwd = p:read '*l'
      p:close()
  - after: |
      os.execute('rm -rf ' .. tmpdir)

  - it fills in-tree script templates when building: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(slurp(tmpdir .. '/shim')).
         to_be("#!/bin/sh\necho '" .. cwd .. "' '1.0'\n")
  - it makes every script executable when building: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(isexecutable(tmpdir .. '/shim')).to_be(true)
      expect(isexecutable(tmpdir .. '/tool')).to_be(true)
      expect(isexecutable(tmpdir .. '/helper')).to_be(true)
  - it builds only the scripts named as targets: |
      expect(luke('--file=' .. fname, 'shim')).to_succeed()
      expect(slurp(tmpdir .. '/shim')).not_to_be(nil)
      expect(slurp(tmpdir .. '/helper')).to_be(nil)
  - it names array entries after their source: |
      expect(luke('--file=' .. fname, 'helper')).to_succeed()
      expect(slurp(tmpdir .. '/helper')).to_be "#!/bin/sh\necho example\n"
  - it installs only installable scripts: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'install')).
         to_succeed_while_containing('cp ' .. tmpdir .. '/tool ' .. bindir .. 'tool')
      expect(slurp(bindir .. 'tool')).to_be "#!/bin/sh\necho tool\n"
      expect(isexecutable(bindir .. 'tool')).to_be(true)
      expect(isexecutable(bindir .. 'helper')).to_be(true)
      expect(slurp(bindir .. 'shim')).to_be(nil)
  - it installs only the scripts named as targets: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'tool', 'install')).
         to_succeed()
      expect(slurp(bindir .. 'tool')).not_to_be(nil)
      expect(slurp(bindir .. 'helper')).to_be(nil)
      expect(slurp(tmpdir .. '/share/lua/' .. _VERSION:match '%d+%.%d+' .. '/other.lua')).
         to_be(nil)
  - it installs scripts beneath INST_BINDIR: |
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir,
         'INST_BINDIR=' .. tmpdir .. '/elsewhere', 'all', 'install')).to_succeed()
      expect(slurp(tmpdir .. '/elsewhere/tool')).not_to_be(nil)
      expect(slurp(bindir .. 'tool')).to_be(nil)
  - it diagnoses non-string script entries: |
      spit(fname, "modules = {x = 'x.lua'}\nbin = {shim = 42}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error 'bad bin.shim: string or table expected, got number'
  - it diagnoses programs without sources: |
      spit(fname, "modules = {x = 'x.lua'}\nbin = {prog = {command = 'true'}}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error 'bad bin.prog: no sources'
  - it diagnoses malformed program env tables: |
      spit(fname, "modules = {x = 'x.lua'}\nbin = {prog = {sources = {'a'}, env = {X = 1}}}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error 'bad bin.prog.env.X: string expected, got number'
  - it diagnoses unsupported install tables: |
      spit(fname, "modules = {x = 'x.lua'}\ninstall = {lua = {}}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error "bad install: unsupported key 'lua'"

- describe programs:
  - before: |
      tmpdir = os.tmpname()
      os.remove(tmpdir)
      assert(os.execute('mkdir ' .. tmpdir))
      spit(tmpdir .. '/other.lua', "return 'other'\n")
      spit(tmpdir .. '/a.txt', 'a\n')
      spit(tmpdir .. '/b.txt.in', '@package@\n')
      spit(tmpdir .. '/hello.c', '#include <stdio.h>\nint main(void){puts("hello");return 0;}\n')
      fname = spit(tmpdir .. '/lukefile', [[
         package = 'example'
         version = '1.0'
         variables = {objdir = ']] .. tmpdir .. [[/obj'}
         modules = {other = ']] .. tmpdir .. [[/other.lua'}
         bin = {
            [']] .. tmpdir .. [[/out/gen'] = {
               command = 'cat $sources > $target; printenv GREETING >> $target',
               env = {GREETING = 'hi $package'},
               sources = {
                  ']] .. tmpdir .. [[/a.txt',
                  ']] .. tmpdir .. [[/b.txt.in',
               },
            },
         }
         install = {
            bin = {
               hello = {sources = {']] .. tmpdir .. [[/hello.c'}},
            },
         }
      ]])

      function isexecutable(path)
         local p = io.popen("test -x '" .. path .. "' && echo yes")
         local s = p:read '*a'
         p:close()
         return s == 'yes\n'
      end
  - after: |
      os.execute('rm -rf ' .. tmpdir)

  - it runs a program command with its env, after filling templates: |
      expect(luke('--file=' .. fname, tmpdir .. '/out/gen')).to_succeed()
      expect(slurp(tmpdir .. '/b.txt')).to_be 'example\n'
      expect(slurp(tmpdir .. '/out/gen')).to_be 'a\nexample\nhi example\n'
      expect(isexecutable(tmpdir .. '/out/gen')).to_be(true)
  - it quotes program env values containing a single quote: |
      spit(fname, [[
         package = "it's"
         version = '1.0'
         modules = {other = ']] .. tmpdir .. [[/other.lua'}
         bin = {
            [']] .. tmpdir .. [[/gen'] = {
               command = 'printenv GREETING > $target',
               env = {GREETING = "hi '$package'"},
               sources = {']] .. tmpdir .. [[/a.txt'},
            },
         }
      ]])
      expect(luke('--file=' .. fname, tmpdir .. '/gen')).to_succeed()
      expect(slurp(tmpdir .. '/gen')).to_be "hi 'it's'\n"
  - it runs a program command without env as is: |
      spit(fname, [[
         package = 'example'
         version = '1.0'
         modules = {other = ']] .. tmpdir .. [[/other.lua'}
         bin = {
            [']] .. tmpdir .. [[/gen'] = {
               command = 'cat $sources > $target',
               sources = {']] .. tmpdir .. [[/a.txt'},
            },
         }
      ]])
      expect(luke('--file=' .. fname, tmpdir .. '/gen')).
         to_succeed_with('cat ' .. tmpdir .. '/a.txt > ' .. tmpdir .. '/gen\nchmod +x ' .. tmpdir .. '/gen\n')
  - it compiles and links C programs beneath objdir: |
      expect(luke('--file=' .. fname, 'hello')).to_succeed()
      expect(isexecutable(tmpdir .. '/obj/hello')).to_be(true)
      p = io.popen(tmpdir .. '/obj/hello')
      expect(p:read '*a').to_be 'hello\n'
      p:close()
  - it installs built programs: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(luke('--file=' .. fname, 'PREFIX=' .. tmpdir, 'install')).
         to_succeed_while_containing('cp ' .. tmpdir .. '/obj/hello ' .. tmpdir .. '/bin/hello')
      expect(isexecutable(tmpdir .. '/bin/hello')).to_be(true)
      expect(slurp(tmpdir .. '/bin/gen')).to_be(nil)
  - it diagnoses programs it cannot build: |
      spit(fname, "package = 'x'\nversion = '1'\nmodules = {x = 'x.lua'}\nbin = {prog = {sources = {'a.txt'}}}")
      p = luke('--file=' .. fname, 'prog')
      expect(p).to_exit(1)
      expect(p).to_contain_error "no command to build 'prog' from a.txt"

- describe files:
  - before: |
      tmpdir = os.tmpname()
      os.remove(tmpdir)
      assert(os.execute('mkdir ' .. tmpdir))
      spit(tmpdir .. '/other.lua', "return 'other'\n")
      spit(tmpdir .. '/a.txt', 'a\n')
      spit(tmpdir .. '/b.txt.in', '@package@\n')
      fname = spit(tmpdir .. '/lukefile', [[
         package = 'example'
         version = '1.0'
         modules = {other = ']] .. tmpdir .. [[/other.lua'}
         files = {
            ']] .. tmpdir .. [[/b.txt.in',
            [']] .. tmpdir .. [[/doc/a.out'] = {
               command = 'cat $sources > $target',
               sources = ']] .. tmpdir .. [[/a.txt',
            },
         }
      ]])

      function isexecutable(path)
         local p = io.popen("test -x '" .. path .. "' && echo yes")
         local s = p:read '*a'
         p:close()
         return s == 'yes\n'
      end
  - after: |
      os.execute('rm -rf ' .. tmpdir)

  - it builds every generated file, without making it executable: |
      expect(luke('--file=' .. fname)).to_succeed()
      expect(slurp(tmpdir .. '/b.txt')).to_be 'example\n'
      expect(slurp(tmpdir .. '/doc/a.out')).to_be 'a\n'
      expect(isexecutable(tmpdir .. '/doc/a.out')).to_be(false)
  - it rebuilds a generated file named as a target: |
      p = luke('--file=' .. fname, tmpdir .. '/doc/a.out')
      expect(p).to_succeed_with('cat ' .. tmpdir .. '/a.txt > ' .. tmpdir .. '/doc/a.out\n')
      expect(slurp(tmpdir .. '/b.txt')).to_be(nil)
  - it names an array entry for the path of its source: |
      expect(luke('--file=' .. fname, tmpdir .. '/b.txt')).to_succeed()
      expect(slurp(tmpdir .. '/b.txt')).to_be 'example\n'
  - it never installs generated files: |
      p = luke('--file=' .. fname, 'PREFIX=' .. tmpdir .. '/inst', 'install')
      expect(p).to_succeed()
      expect(p.output).not_to_contain(tmpdir .. '/inst/bin')
  - it diagnoses malformed entries: |
      spit(fname, "modules = {x = 'x.lua'}\nfiles = {['doc/x.1'] = {command = 'true'}}")
      p = luke('--file=' .. fname)
      expect(p).to_exit(1)
      expect(p).to_contain_error "bad files['doc/x.1']: no sources"
