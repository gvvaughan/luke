before: |
  -- Return a fresh luke.schema, whose diagnostics raise errors rather
  -- than kill the spec runner.
  function setup()
     replace(require 'luke._base', 'fatal', function(fmt, ...)
        error(string.format(fmt, ...), 0)
     end)
     return reload 'luke.schema'
  end

specify luke.schema:
- after:
    restore()

- describe mkcheck:
  - it accepts a value of the given type: |
      schema = setup()
      expect(schema.mkcheck 'string'('x', 'p')).to_be 'x'
  - it accepts nil: |
      schema = setup()
      expect(schema.mkcheck 'string'(nil, 'p')).to_be(nil)
  - it diagnoses another type at its path: |
      schema = setup()
      expect(schema.mkcheck 'string'(1, 'p')).
         to_raise 'bad p: string expected, got number'

- describe listof:
  - it treats a string as a list of one: |
      schema = setup()
      expect(schema.listof(schema.mkcheck 'string')('x', 'p')).to_equal {'x'}
  - it normalizes every element: |
      schema = setup()
      expect(schema.listof(schema.mkcheck 'string') {'x', 'y'}).to_equal {'x', 'y'}
  - it diagnoses an element at its index: |
      schema = setup()
      expect(schema.listof(schema.mkcheck 'string')({'x', 2}, 'p')).
         to_raise 'bad p[2]: string expected, got number'

- describe mapof:
  - it normalizes every value: |
      schema = setup()
      expect(schema.mapof(schema.listof(schema.mkcheck 'string'))({a = 'x'}, 'p')).
         to_equal {a = {'x'}}
  - it diagnoses a value at its key: |
      schema = setup()
      expect(schema.mapof(schema.mkcheck 'string')({['a.b'] = 1}, 'p')).
         to_raise "bad p['a.b']: string expected, got number"
  - it diagnoses names that fail the names normalizer: |
      schema = setup()
      expect(schema.mapof(schema.mkcheck 'string', schema.mkcheck 'string')({'x'}, 'p')).
         to_raise 'bad p[1]: string expected, got number'

- describe fields:
  - it normalizes each known key: |
      schema = setup()
      expect(schema.fields {a = schema.listof(schema.mkcheck 'string')}({a = 'x'}, '')).
         to_equal {a = {'x'}}
  - it diagnoses unknown keys: |
      schema = setup()
      expect(schema.fields {}({b = 1}, 'p')).
         to_raise "bad p: unsupported key 'b'"
  - it lets unknown keys through when open: |
      schema = setup()
      expect(schema.fields({}, true)({b = 1}, '')).to_equal {b = 1}
  - it writes paths beneath the top level without a leading dot: |
      schema = setup()
      expect(schema.fields {a = schema.mkcheck 'string'}({a = 1}, '')).
         to_raise 'bad a: string expected, got number'

- describe keypaths:
  - it lists every key, with the keys of nested fields beneath theirs: |
      schema = setup()
      string = schema.mkcheck 'string'
      expect(schema.keypaths(schema.fields {
         b = string,
         a = schema.fields {y = string, ['x-z'] = string},
      })).to_equal(list('a', 'a.y', "a['x-z']", 'b'))

- describe pathname:
  - it accepts a path that is already normal: |
      schema = setup()
      expect(schema.pathname('doc/api', 'p')).to_be 'doc/api'
  - it removes '.' and empty components, and a trailing slash: |
      schema = setup()
      expect(schema.pathname('./doc//api/./', 'p')).to_be 'doc/api'
  - it writes the directory itself as '.': |
      schema = setup()
      expect(schema.pathname('./', 'p')).to_be '.'
      expect(schema.pathname('.', 'p')).to_be '.'
  - it keeps an absolute path absolute: |
      schema = setup()
      expect(schema.pathname('/usr//include/', 'p')).to_be '/usr/include'
      expect(schema.pathname('/', 'p')).to_be '/'
  - it leaves '..' and variables alone: |
      schema = setup()
      expect(schema.pathname('$PREFIX/../lib/', 'p')).to_be '$PREFIX/../lib'
      expect(schema.pathname('doc/..', 'p')).to_be 'doc/..'
  - it accepts nil: |
      schema = setup()
      expect(schema.pathname(nil, 'p')).to_be(nil)
  - it diagnoses an empty path: |
      schema = setup()
      expect(schema.pathname('', 'p')).to_raise 'bad p: empty path'
  - it diagnoses other types: |
      schema = setup()
      expect(schema.pathname(42, 'p')).to_raise 'bad p: string expected, got number'

- describe luke_format:
  - it diagnoses a missing format, as for luke 0.4 and earlier: |
      schema = setup()
      expect(schema.luke_format(nil, 'p')).to_raise
         'bad p: missing; this luke reads format 0, which replaces the lukefiles of luke 0.4 and earlier'
  - it accepts the format of this luke: |
      schema = setup()
      expect(schema.luke_format(0, 'p')).to_be(0)
  - it diagnoses a newer format: |
      schema = setup()
      expect(schema.luke_format(1, 'p')).
         to_raise 'bad p: lukefile format 1 needs a newer luke; this one reads format 0'
  - it diagnoses anything but a non-negative integer: |
      schema = setup()
      expect(schema.luke_format(-1, 'p')).to_raise 'bad p: non-negative integer expected, got -1'
      expect(schema.luke_format(0.5, 'p')).to_raise 'bad p: non-negative integer expected, got 0.5'
      expect(schema.luke_format('0', 'p')).to_raise 'bad p: number expected, got string'

- describe pairof:
  - it pairs a name with its normalized value: |
      schema = setup()
      expect(schema.pairof(schema.rules)({['a.b'] = 'a.lua'}, 'p')).
         to_equal {['a.b'] = {sources = {'a.lua'}}}
  - it diagnoses an entry with more than one name: |
      schema = setup()
      expect(schema.pairof(schema.rules)({a = 'a.lua', b = 'b.lua'}, 'p')).
         to_raise 'bad p: one entry expected, got 2'
  - it diagnoses a name that is not a string: |
      schema = setup()
      expect(schema.pairof(schema.rules)({'a.lua'}, 'p')).to_raise 'bad p: name expected, got number'
  - it diagnoses an entry that is not a table: |
      schema = setup()
      expect(schema.pairof(schema.rules)('a.lua', 'p')).to_raise 'bad p: table expected, got string'
  - it diagnoses a value at its path: |
      schema = setup()
      expect(schema.pairof(schema.rules)({a = 42}, 'p')).
         to_raise 'bad p.a: string or table expected, got number'

- describe ordered_map:
  - before: |
      -- An entry normalizer that accepts any one-pair table as it is.
      function pair(x) return x end

  - it keeps the entries in the order written: |
      schema = setup()
      expect(schema.ordered_map(pair)({{b = 1}, {a = 2}}, 'p')).to_equal {{b = 1}, {a = 2}}
  - it lets a platform replace an entry, in place: |
      schema = setup()
      expect(schema.ordered_map(pair)({{a = 1}, {b = 2}, platforms = {unix = {{a = 3}}}}, 'p')).
         to_equal {{a = 3}, {b = 2}}
  - it diagnoses a field rather than a list entry: |
      schema = setup()
      expect(schema.ordered_map(pair)({a = 1}, 'p')).
         to_raise 'bad p.a: list entry expected, such as {a = ...}'
  - it narrows the platforms in the value of an entry: |
      schema = setup()
      expect(schema.ordered_map(pair)({{a = {x = 1, platforms = {unix = {x = 2}}}}}, 'p')).
         to_equal {{a = {x = 2}}}
  - it leaves an ordered map in the value of an entry for its own normalizer: |
      schema = setup()
      expect(schema.ordered_map(pair)({{a = {defines = {'X', platforms = {unix = {'Y'}}}}}}, 'p')).
         to_equal {{a = {defines = {'X', platforms = {unix = {'Y'}}}}}}
  - it names every ordered map in the lukefile: |
      schema = setup()
      expect(schema.ORDERED).to_equal {
         bin = true, defines = true, external_dependencies = true, files = true, modules = true,
      }
  - it diagnoses a name with two entries, for another platform too: |
      schema = setup()
      expect(schema.ordered_map(pair)({platforms = {windows = {{a = 1}, {a = 2}}}}, 'p')).
         to_raise "bad p.platforms.windows: more than one entry for 'a'"

- describe dependencies:
  - it keeps dependencies in the order written: |
      schema = setup()
      expect(schema.dependencies({{ZZ = {library = 'z'}}, {AA = {library = 'a'}}}, 'p')).
         to_equal {{ZZ = {library = 'z'}}, {AA = {library = 'a'}}}
  - it diagnoses a name that cannot name a variable: |
      schema = setup()
      expect(schema.dependencies({{['my-dep'] = {library = 'x'}}}, 'p')).
         to_raise "bad p[1]: bad dependency name 'my-dep'"
  - it diagnoses a dependency that is not a table: |
      schema = setup()
      expect(schema.dependencies({{YAML = 'yaml'}}, 'p')).
         to_raise 'bad p[1].YAML: table expected, got string'

- describe defines:
  - it keeps each macro definition in order: |
      schema = setup()
      expect(schema.defines({{B = 2}, {A = '"a"'}}, 'p')).to_equal {{B = 2}, {A = '"a"'}}
  - it accepts rockspec style definitions: |
      schema = setup()
      expect(schema.defines({'NDEBUG', '_XOPEN_SOURCE=700', 'EMPTY='}, 'p')).
         to_equal {{NDEBUG = 1}, {_XOPEN_SOURCE = '700'}, {EMPTY = ''}}
  - it keeps the order of both styles mixed together: |
      schema = setup()
      expect(schema.defines({'NDEBUG', {HAVE_STATVFS = {checkfunc = 'statvfs'}}, 'A=1'}, 'p')).
         to_equal {{NDEBUG = 1}, {HAVE_STATVFS = {checkfunc = 'statvfs'}}, {A = '1'}}
  - it accepts nil: |
      schema = setup()
      expect(schema.defines(nil, 'p')).to_be(nil)
  - it diagnoses a keyed definition outside a list entry: |
      schema = setup()
      expect(schema.defines({'A', NDEBUG = 1}, 'p')).
         to_raise 'bad p.NDEBUG: list entry expected, such as {NDEBUG = ...}'
  - it diagnoses an entry with more than one definition: |
      schema = setup()
      expect(schema.defines({{A = 1, B = 2}}, 'p')).
         to_raise 'bad p[1]: one definition expected, got 2'
  - it diagnoses an entry with no definition: |
      schema = setup()
      expect(schema.defines({{}}, 'p')).to_raise 'bad p[1]: one definition expected, got 0'
  - it diagnoses a probe without a macro name: |
      schema = setup()
      expect(schema.defines({{checkfunc = 'statvfs'}}, 'p')).
         to_raise 'bad p[1]: probe needs a macro name, such as {HAVE_X = {checkfunc = ...}}'
  - it diagnoses the same macro defined twice: |
      schema = setup()
      expect(schema.defines({{A = 1}, 'B', {A = 2}}, 'p')).
         to_raise "bad p: more than one entry for 'A'"
      expect(schema.defines({'A', 'A=2'}, 'p')).
         to_raise "bad p: more than one entry for 'A'"
  - it diagnoses a macro defined both by a string and a table entry: |
      schema = setup()
      expect(schema.defines({{A = 1}, 'A=2'}, 'p')).
         to_raise "bad p: more than one entry for 'A'"
      expect(schema.defines({'A', {A = 1}}, 'p')).
         to_raise "bad p: more than one entry for 'A'"
  - it diagnoses a malformed rockspec style definition: |
      schema = setup()
      expect(schema.defines({'1A=2'}, 'p')).to_raise "bad p[1]: bad macro definition '1A=2'"
  - it diagnoses a malformed macro name: |
      schema = setup()
      expect(schema.defines({{['A-B'] = 1}}, 'p')).to_raise "bad p[1]: bad macro name 'A-B'"
  - it lets a platform redefine a macro, where it was first defined: |
      schema = setup()
      expect(schema.defines({'A=1', 'B', platforms = {unix = {'C', 'A=2'}}}, 'p')).
         to_equal {{A = '2'}, {B = 1}, {C = 1}}
  - it uses the platform defaults without a matching platform: |
      schema = setup()
      expect(schema.defines({'A=1', platforms = {windows = {'A=3'}, 'A=2'}}, 'p')).
         to_equal {{A = '2'}}
  - it lets a more specific platform redefine a macro: |
      schema = setup()
      expect(schema.defines({platforms = {unix = {'A=1'}, linux = {'A=2'}, macosx = {'A=2'}}}, 'p')).
         to_equal {{A = '2'}}
  - it diagnoses a duplicate within a platform that is not this one: |
      schema = setup()
      expect(schema.defines({'A', platforms = {qnx = {'B=1', {B = 2}}}}, 'p')).
         to_raise "bad p.platforms.qnx: more than one entry for 'B'"
  - it diagnoses a duplicate within platform defaults that are not used: |
      schema = setup()
      expect(schema.defines({platforms = {unix = {'A'}, 'B', 'B=2'}}, 'p')).
         to_raise "bad p.platforms: more than one entry for 'B'"
  - it diagnoses a malformed definition for a platform that is not this one: |
      schema = setup()
      expect(schema.defines({platforms = {windows = {'1A'}}}, 'p')).
         to_raise "bad p.platforms.windows[1]: bad macro definition '1A'"
  - it diagnoses a field of a platform that is not this one: |
      schema = setup()
      expect(schema.defines({platforms = {qnx = {A = 1}}}, 'p')).
         to_raise 'bad p.platforms.qnx.A: list entry expected, such as {A = ...}'
  - it diagnoses a malformed platforms table: |
      schema = setup()
      expect(schema.defines({platforms = 'unix'}, 'p')).
         to_raise 'bad p.platforms: table expected, got string'
      expect(schema.defines({platforms = {unix = 'A'}}, 'p')).
         to_raise 'bad p.platforms.unix: table expected, got string'
  - it diagnoses a value that is neither a string, a number nor a probe: |
      schema = setup()
      expect(schema.defines({{A = true}}, 'p')).
         to_raise 'bad p[1].A: string, number or probe expected, got boolean'
      expect(schema.defines({{A = {}}}, 'p')).
         to_raise 'bad p[1].A: string, number or probe expected, got table'
  - it treats a string as a list of one: |
      schema = setup()
      expect(schema.defines('NDEBUG', 'p')).to_equal {{NDEBUG = 1}}
  - it diagnoses other types: |
      schema = setup()
      expect(schema.defines(42, 'p')).to_raise 'bad p: table expected, got number'
      expect(schema.defines({42}, 'p')).to_raise 'bad p[1]: string or table expected, got number'

- describe rules:
  - it normalizes module defines: |
      schema = setup()
      expect(schema.rules({sources = 'a.c', defines = {'NDEBUG'}}, 'p')).
         to_equal {sources = {'a.c'}, defines = {{NDEBUG = 1}}}
      expect(schema.rules({sources = 'a.c', defines = {NDEBUG = 1}}, 'p')).
         to_raise 'bad p.defines.NDEBUG: list entry expected, such as {NDEBUG = ...}'
  - it accepts a single source: |
      schema = setup()
      expect(schema.rules('a.lua', 'p')).to_equal {sources = {'a.lua'}}
  - it normalizes each source path: |
      schema = setup()
      expect(schema.rules('./a.lua', 'p')).to_equal {sources = {'a.lua'}}
      expect(schema.rules({'./a.c', 'src//b.c'}, 'p')).to_equal {sources = {'a.c', 'src/b.c'}}
      expect(schema.rules({sources = {'./a.c'}, libraries = {'m'}}, 'p')).
         to_equal {sources = {'a.c'}, libraries = {'m'}}
  - it normalizes include and library directories: |
      schema = setup()
      expect(schema.rules({sources = 'a.c', incdirs = './include/', libdirs = {'lib/'}}, 'p')).
         to_equal {sources = {'a.c'}, incdirs = {'include'}, libdirs = {'lib'}}
  - it accepts a list of sources: |
      schema = setup()
      expect(schema.rules({'a.c', 'b.c'}, 'p')).to_equal {sources = {'a.c', 'b.c'}}
  - it accepts a single sources string among other settings: |
      schema = setup()
      expect(schema.rules({sources = 'a.c', libraries = {'m'}}, 'p')).
         to_equal {sources = {'a.c'}, libraries = {'m'}}
  - it diagnoses other types: |
      schema = setup()
      expect(schema.rules(42, 'p')).
         to_raise 'bad p: string or table expected, got number'

- describe copies:
  - it maps each destination to its source: |
      schema = setup()
      expect(schema.copies({{['index.md'] = 'doc/demo.md'}}, 'p')).
         to_equal {{['index.md'] = {optional = false, source = 'doc/demo.md'}}}
  - it copies a bare entry to the same path, when there is one: |
      schema = setup()
      expect(schema.copies({'_config.yml.in'}, 'p')).
         to_equal {{['_config.yml.in'] = {optional = true, source = '_config.yml.in'}}}
  - it keeps the entries in the order written: |
      schema = setup()
      expect(schema.copies({{['.'] = 'doc'}, {api = 'build/api'}, '_config.yml.in'}, 'p')).
         to_equal {
            {['.'] = {optional = false, source = 'doc'}},
            {api = {optional = false, source = 'build/api'}},
            {['_config.yml.in'] = {optional = true, source = '_config.yml.in'}},
         }
  - it diagnoses other sources at their path: |
      schema = setup()
      expect(schema.copies({{api = 42}}, 'p')).
         to_raise 'bad p[1].api: string expected, got number'
  - it diagnoses a bare entry and a pair for the same path: |
      schema = setup()
      expect(schema.copies({{['index.md'] = 'doc/demo.md'}, 'index.md'}, 'p')).
         to_raise "bad p: more than one entry for 'index.md'"
  - it diagnoses a template filled into a path that is also copied: |
      schema = setup()
      expect(schema.copies({{['_config.yml'] = 'doc/config.yml'}, '_config.yml.in'}, 'p')).
         to_raise "bad p: more than one entry for '_config.yml'"
  - it fills a renamed template into its own name: |
      schema = setup()
      expect(schema.copies({{['_config.yml'] = 'doc/config.yml.in'}}, 'p')).
         to_equal {{['_config.yml'] = {optional = false, source = 'doc/config.yml.in'}}}
  - it normalizes destination and source paths: |
      schema = setup()
      expect(schema.copies({{['./api/'] = 'doc/api/'}, {['./'] = './doc'}, './_config.yml.in'}, 'p')).
         to_equal {
            {api = {optional = false, source = 'doc/api'}},
            {['.'] = {optional = false, source = 'doc'}},
            {['_config.yml.in'] = {optional = true, source = '_config.yml.in'}},
         }
  - it diagnoses entries for the same path spelled differently: |
      schema = setup()
      expect(schema.copies({{['api/'] = 'doc/api'}, {['./api'] = 'doc/api'}}, 'p')).
         to_raise "bad p: more than one entry for 'api'"
  - it diagnoses an empty destination path: |
      schema = setup()
      expect(schema.copies({{[''] = 'doc'}}, 'p')).to_raise "bad p[1]: empty path"
  - it diagnoses keyed entries: |
      schema = setup()
      expect(schema.copies({api = 'doc/api'}, 'p')).
         to_raise 'bad p.api: list entry expected, such as {api = ...}'
  - it keeps a command to run after copying: |
      schema = setup()
      r = schema.copies({{['.'] = 'doc'}, command = 'rm -f examples/*.lua'}, 'p')
      expect(r.command).to_be 'rm -f examples/*.lua'
      expect(r[1]).to_equal {['.'] = {optional = false, source = 'doc'}}
  - it diagnoses a command that is not a string: |
      schema = setup()
      expect(schema.copies({command = 42}, 'p')).
         to_raise 'bad p.command: string expected, got number'

- describe files:
  - it names a bare entry after the path of its source: |
      schema = setup()
      expect(schema.files({'doc/demo.md.in'}, 'files')).to_equal {{['doc/demo.md'] = 'doc/demo.md.in'}}
  - it keeps the entries in the order written: |
      schema = setup()
      expect(schema.files({'doc/z.md.in', {['doc/a.1'] = {command = 'true', sources = 'a.in'}}}, 'files')).
         to_equal {{['doc/z.md'] = 'doc/z.md.in'}, {['doc/a.1'] = {command = 'true', sources = {'a.in'}}}}
  - it diagnoses entries at their path: |
      schema = setup()
      expect(schema.files({{['doc/demo.1'] = {command = 'true'}}}, 'files')).
         to_raise "bad files[1]['doc/demo.1']: no sources"
  - it normalizes target and source paths: |
      schema = setup()
      expect(schema.files({'./doc//demo.md.in', {['./doc/demo.1'] = {command = 'true', sources = './demo.in'}}}, 'files')).
         to_equal {
            {['doc/demo.md'] = 'doc/demo.md.in'},
            {['doc/demo.1'] = {command = 'true', sources = {'demo.in'}}},
         }
  - it diagnoses targets for the same path spelled differently: |
      schema = setup()
      expect(schema.files({'doc/demo.md.in', {['./doc/demo.md'] = 'demo.md.in'}}, 'files')).
         to_raise "bad files: more than one entry for 'doc/demo.md'"
  - it diagnoses keyed entries: |
      schema = setup()
      expect(schema.files({['doc/demo.1'] = 'demo.1.in'}, 'files')).
         to_raise "bad files['doc/demo.1']: list entry expected, such as {['doc/demo.1'] = ...}"

- describe scripts:
  - it names a bare entry after its source: |
      schema = setup()
      expect(schema.scripts({'bin/tool.in'}, 'bin')).to_equal {{tool = 'bin/tool.in'}}
  - it keeps the entries in the order written: |
      schema = setup()
      expect(schema.scripts({{zz = 'zz.in'}, 'bin/aa.in'}, 'bin')).to_equal {{zz = 'zz.in'}, {aa = 'bin/aa.in'}}
  - it diagnoses a bare entry named like another: |
      schema = setup()
      expect(schema.scripts({'tool.in', {tool = 'bin/tool'}}, 'bin')).
         to_raise "bad bin: more than one entry for 'tool'"
  - it diagnoses bare entries with the same name: |
      schema = setup()
      expect(schema.scripts({'bin/tool.in', 'src/tool'}, 'bin')).
         to_raise "bad bin: more than one entry for 'tool'"
  - it normalizes program sources: |
      schema = setup()
      expect(schema.scripts({{prog = {sources = 'a.c'}}}, 'bin')).
         to_equal {{prog = {sources = {'a.c'}}}}
  - it normalizes source paths: |
      schema = setup()
      expect(schema.scripts({'./bin//tool.in', {prog = {sources = './a.c'}}}, 'bin')).
         to_equal {{tool = 'bin/tool.in'}, {prog = {sources = {'a.c'}}}}
  - it diagnoses programs without a name: |
      schema = setup()
      expect(schema.scripts({{sources = 'a.c'}}, 'bin')).
         to_raise 'bad bin[1]: programs need a name, such as {prog = {sources = ...}}'
  - it accepts a script or program named sources, written as ./sources: |
      schema = setup()
      expect(schema.scripts({{['./sources'] = 'bin/sources.in'}}, 'bin')).
         to_equal {{sources = 'bin/sources.in'}}
      expect(schema.scripts({{['./sources'] = {sources = 'sources.c'}}}, 'bin')).
         to_equal {{sources = {sources = {'sources.c'}}}}
  - it accepts a script named like a program rule: |
      schema = setup()
      expect(schema.scripts({{env = 'bin/env.in'}, {command = 'bin/command'}}, 'bin')).
         to_equal {{env = 'bin/env.in'}, {command = 'bin/command'}}
  - it diagnoses non-string program commands: |
      schema = setup()
      expect(schema.scripts({{prog = {sources = 'a.c', command = {}}}}, 'bin')).
         to_raise 'bad bin[1].prog.command: string expected, got table'
  - it diagnoses entries that are neither a source nor a table: |
      schema = setup()
      expect(schema.scripts({42}, 'bin')).to_raise 'bad bin[1]: string or table expected, got number'
      expect(schema.scripts({{prog = 42}}, 'bin')).
         to_raise 'bad bin[1].prog: string or table expected, got number'
  - it diagnoses keyed entries: |
      schema = setup()
      expect(schema.scripts({tool = 'bin/tool.in'}, 'bin')).
         to_raise 'bad bin.tool: list entry expected, such as {tool = ...}'
