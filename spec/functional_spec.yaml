before:
  functional = require 'luke.functional'

specify luke.functional:
- describe choose:
  - before:
      choose = functional.choose

  - it returns the consequent when the test is truthy:
      expect(choose(true, 'yes', 'no')).to_be 'yes'
      expect(choose(0, 'yes', 'no')).to_be 'yes'
  - it returns the alternative when the test is falsy:
      expect(choose(false, 'yes', 'no')).to_be 'no'
      expect(choose(nil, 'yes', 'no')).to_be 'no'
  - it returns a falsy consequent:
      expect(choose(true, false, 'no')).to_be(false)
      expect(choose(true, nil, 'no')).to_be(nil)
  - it calls only the chosen leg, with the test:
      called = {}
      expect(choose('t', function(x) called.yes = x; return 1 end,
         function(x) called.no = x; return 2 end)).to_be(1)
      expect(called).to_equal {yes = 't'}

- describe isempty:
  - before:
      isempty = functional.isempty

  - it is true for an empty table:
      expect(isempty {}).to_be(true)
  - it is true for an empty list:
      expect(isempty(list())).to_be(true)
      expect(isempty(functional.keys {})).to_be(true)
  - it is false for a table with elements:
      expect(isempty {1}).to_be(false)
      expect(isempty {a=1}).to_be(false)
      expect(isempty(list(1))).to_be(false)
  - it is false for a table with only a non-zero n field:
      expect(isempty {n=1}).to_be(false)
  - it is false for anything else:
      expect(isempty(nil)).to_be(false)
      expect(isempty '').to_be(false)

- describe keys:
  - before:
      keys = functional.keys

  - it returns a list of table keys:
      r = keys {a=2, b=1, 'c'}
      expect(r.n).to_be(3)
      expect(set(unpack(r, 1, r.n))).to_equal(set(1, 'a', 'b'))

- describe sorted:
  - before:
      sorted = functional.sorted

  - it returns a sorted copy, leaving its argument unchanged:
      seq = {3, 1, 2}
      expect(sorted(seq)).to_equal {1, 2, 3}
      expect(seq).to_equal {3, 1, 2}
  - it sorts with a comparator:
      expect(sorted({1, 3, 2}, function(a, b) return a > b end)).to_equal {3, 2, 1}
  - it keeps the length of a list:
      expect(sorted(list('b', 'a'))).to_equal(list('a', 'b'))

- describe partition:
  - before:
      partition = functional.partition
      square, nonsquare = partition(list(1, 2, 3, 4, 5, 6, 7, 8, 9), function(x)
         local sqrt = math.sqrt(x)
         return math.ceil(sqrt) == sqrt
      end)

  - it separates a list according to a predicate:
      expect(square).to_equal(list(1, 4, 9))
      expect(nonsquare).to_equal(list(2, 3, 5, 6, 7, 8))
