before:
  functional = require 'luke.functional'

specify luke.functional:
- describe append:
  - before:
      append = functional.append

  - it adds an item to the end of a list, and counts it in n:
      expect(append(list('a'), 'b')).to_equal(list('a', 'b'))
  - it appends to an empty table:
      expect(append({}, 'a')).to_equal {n = 1, 'a'}
  - it keeps a nil item, counting it:
      expect(append(list('a'), nil)).to_equal(list('a', nil))
  - it returns the list it was given:
      seq = list()
      expect(append(seq, 1)).to_be(seq)
  - it counts the items of a list without an n field:
      expect(append({'a', 'b'}, 'c')).to_equal {n = 3, 'a', 'b', 'c'}

- describe pop:
  - before:
      pop = functional.pop

  - it removes and returns the last item, and counts one less:
      seq = list('a', 'b')
      expect(pop(seq)).to_be 'b'
      expect(seq).to_equal(list('a'))
  - it pops a trailing nil:
      seq = list('a', nil)
      expect(pop(seq)).to_be(nil)
      expect(seq).to_equal(list('a'))
  - it pops from a list without an n field:
      seq = {'a', 'b'}
      expect(pop(seq)).to_be 'b'
      expect(seq).to_equal {'a'}
  - it returns nil from an empty list, and stays empty:
      seq = list()
      expect(pop(seq)).to_be(nil)
      expect(seq).to_equal(list())

- describe ordered_merge:
  - before:
      ordered_merge = functional.ordered_merge

  - it keeps the order of the pairs in each list, skipping nils: |
      expect(ordered_merge({{b = 1}, {a = 2}}, nil, {{c = 3}})).to_equal {{b = 1}, {a = 2}, {c = 3}}
  - it gives each key the value of its last pair, where it first appears: |
      expect(ordered_merge({{a = 1}, {b = 2}}, {{c = 3}, {a = 4}})).to_equal {{a = 4}, {b = 2}, {c = 3}}
  - it copies each pair, leaving its arguments unchanged: |
      t = {{a = 1}}
      expect(ordered_merge(t, {{a = 2}})).to_equal {{a = 2}}
      expect(t).to_equal {{a = 1}}

- describe ordered_keys:
  - before:
      ordered_keys = functional.ordered_keys

  - it lists the key of each pair, in order: |
      expect(ordered_keys {{b = 1}, {a = 2}, {c = 3}}).to_equal(list('b', 'a', 'c'))
  - it lists nothing for nil or an empty list: |
      expect(ordered_keys(nil)).to_equal(list())
      expect(ordered_keys {}).to_equal(list())

- describe ordered_get:
  - before:
      ordered_get = functional.ordered_get

  - it returns the value paired with a key: |
      expect(ordered_get({{b = 1}, {a = 2}}, 'a')).to_be(2)
  - it returns nil for a key with no pair, or for nil: |
      expect(ordered_get({{b = 1}}, 'a')).to_be(nil)
      expect(ordered_get(nil, 'a')).to_be(nil)

- describe ordered_pluck:
  - before:
      ordered_pluck = functional.ordered_pluck

  - it keeps the pairs for the given keys, in their own order: |
      expect(ordered_pluck({{b = 1}, {a = 2}, {c = 3}}, {'c', 'b'})).to_equal(list({b = 1}, {c = 3}))
  - it keeps nothing from nil: |
      expect(ordered_pluck(nil, {'a'})).to_equal(list())

- describe ordered_mapvalues:
  - before:
      ordered_mapvalues = functional.ordered_mapvalues

  - it maps the value of each pair, keeping keys and order: |
      expect(ordered_mapvalues({{b = 1}, {a = 2}}, function(v) return v * 10 end)).
         to_equal {{b = 10}, {a = 20}}
  - it leaves its argument unchanged: |
      t = {{a = 1}}
      expect(ordered_mapvalues(t, function(v) return v + 1 end)).to_equal {{a = 2}}
      expect(t).to_equal {{a = 1}}

- describe set:
  - before:
      set = functional.set

  - it makes a table with each item as a key for true:
      expect(set {'a', 'b', 'a'}).to_equal {a = true, b = true}
  - it makes an empty table from nothing:
      expect(set {}).to_equal {}
  - it takes the items of an iterator function:
      expect(set(('a b'):gmatch '%a')).to_equal {a = true, b = true}
