before: |
  context_manager = require 'type.context-manager'

  -- Does it quack like a context manager?
  function iscontextmanager(x)
     return not not (x.context and x.release and type(x.n) == 'number' and x.filename)
  end

  function exists(path)
     local fh = io.open(path)
     return fh ~= nil and fh:close()
  end

specify type.context-manager:
- describe ContextManager:
  - before: |
      ContextManager = context_manager.ContextManager

      -- A callable that records the arguments of each call.
      function record(name)
         return setmetatable({n=0, name=name}, {
            __call = function(self, ...)
               self.n = self.n + 1
               self[self.n] = pack(...)
               return {}
            end,
         })
      end

      acquire = record 'acquire'
      cm = ContextManager(record 'release', acquire, 'arg1', 'arg2')

  - it returns a context manager instance:
      expect(iscontextmanager(cm)).to_be(true)

  - it acquires a resource once:
      expect(acquire.n).to_be(1)

  - it passes additional parameters to acquire:
      expect(acquire[1]).to_equal(pack('arg1', 'arg2'))

  - it releases the resource once:
      cm:release()
      expect(cm.release.n).to_be(1)

- describe File:
  - before:
      File = context_manager.File
      cm = File('build-aux/luke', 'r')

  - after:
      cm:release()

  - it returns a context manager instance:
      expect(iscontextmanager(cm)).to_be(true)

  - it records the calling arguments:
      expect(cm[1]).to_be 'build-aux/luke'
      expect(cm[2]).to_be 'r'

  - it records the number of arguments:
      expect(cm.n).to_be(2)

  - it supports filename property:
      expect(cm.filename).to_be(cm[1])

  - it propagates acquire errors: |
      fname = 'this/file/does/not/exist!/nope :)'
      expect(list(File(fname, 'r'))).to_equal(list(nil, fname .. ': No such file or directory'))

- describe CTest:
  - before:
      CTest = context_manager.CTest
      cm = CTest()

  - after:
      cm:release()

  - it returns a context manager instance:
      expect(iscontextmanager(cm)).to_be(true)

  - it has a filename ending in .c:
      expect(cm.filename).to_match '%.c$'

  - it has an objfile in the current directory, ending in .o:
      expect(cm.objfile).to_be((cm.filename:gsub('^.*/', ''):gsub('%.c$', '.o')))

- describe CTest release:
  - before: |
      CTest = context_manager.CTest

      function probe(keep)
         local cm = CTest(keep)
         local filename, objfile = cm.filename, cm.objfile
         cm:write 'int x;\n'
         io.open(objfile, 'w'):close()
         cm:release()
         return filename, objfile
      end

  - it removes the source and object files:
      filename, objfile = probe()
      expect(exists(filename)).to_be(false)
      expect(exists(objfile)).to_be(false)

  - it keeps the source and object files when asked:
      filename, objfile = probe(true)
      expect(exists(filename)).to_be(true)
      expect(exists(objfile)).to_be(true)
      os.remove(filename)
      os.remove(objfile)
      os.remove((filename:gsub('%.c$', '')))

- describe slurp:
  - before:
      File, slurp = context_manager.File, context_manager.slurp

  - it propagates context manager errors: |
      fname = 'this/file/does/not/exist/either =)O|'
      expect(list(slurp(File(fname, 'r')))).to_equal(list(nil, fname .. ': No such file or directory'))

  - it returns the entire contents of named file:
      fh = io.open('build-aux/luke', 'r')
      content = fh:read '*a'
      fh:close()
      cm = File('build-aux/luke', 'r')
      expect(slurp(cm)).to_be(content)
      cm:release()

- describe with:
  - before:
      File, with = context_manager.File, context_manager.with

  - it releases passed context managers:
      cm1, cm2 = File('f1', 'w'), File('f2', 'w')
      cm1.release, cm2.release = Stub(cm1.release), Stub(cm2.release)
      with(cm1, cm2, function(first, second)
         expect(first).to_be(cm1)
         expect(second).to_be(cm2)
      end)
      expect(cm1.release[1]).to_be(cm1)
      expect(cm2.release[1]).to_be(cm2)
      os.remove 'f1'
      os.remove 'f2'

  - it does not try to release unacquired context managers:
      fname = 'this/is/not/an/existing/file!'
      with(File(fname, 'r'), File(fname, 'r'), function(...)
         argu = list(...)
      end)
      expect(argu).to_equal(list(nil, nil))
