before: |
  compile = require 'luke.compile'
  E = require 'luke.environment'

  -- A fresh scratch directory name, which does not exist yet.
  function tmpdir()
     local name = os.tmpname()
     os.remove(name)
     return name
  end

  function slurp(filename)
     local fh = io.open(filename)
     if fh ~= nil then
        local s = fh:read '*a'
        fh:close()
        return s
     end
  end

specify luke.compile:
- describe incdirs:
  - before:
      incdirs = compile.incdirs

  - it prepends -I to argument:
      expect(incdirs '/usr/local/include').to_equal {'-I/usr/local/include', n=1}

  - it prepends -I to each argument in a list:
      dirs = {'/usr/local/include', '/opt/yaml/include', '/opt/libgit2/include'}
      expect(incdirs(dirs)).to_equal {
         '-I/usr/local/include', '-I/opt/yaml/include', '-I/opt/libgit2/include', n=3,
      }

  - it returns an empty list for no arguments:
      expect(incdirs()).to_equal {n=0}

- describe libdirs:
  - before:
      libdirs = compile.libdirs

  - it prepends -L to argument:
      expect(libdirs '/usr/local/lib').to_equal {'-L/usr/local/lib', n=1}

  - it prepends -L to each argument in a list:
      dirs = {'/usr/local/lib', '/opt/yaml/lib', '/opt/libgit2/lib'}
      expect(libdirs(dirs)).to_equal {
         '-L/usr/local/lib', '-L/opt/yaml/lib', '-L/opt/libgit2/lib', n=3,
      }

  - it returns an empty list for no arguments:
      expect(libdirs()).to_equal {n=0}

- describe defines:
  - before:
      defines = compile.defines

  - it defines a flag for the value 1:
      expect(defines(OrderedMap {{NDEBUG=1}})).to_equal(list '-DNDEBUG')

  - it defines a plain value:
      expect(defines(OrderedMap {{_XOPEN_SOURCE=700}})).to_equal(list '-D_XOPEN_SOURCE=700')

  - it quotes a value containing shell metacharacters: |
      expect(defines(OrderedMap {{VERSION='"git"'}})).to_equal(list [[-DVERSION='"git"']])

  - it quotes a value containing a single quote: |
      expect(defines(OrderedMap {{GREETING="it's"}})).to_equal(list [[-DGREETING='it'\''s']])

  - it defines each macro in order: |
      expect(defines(OrderedMap {{C=3}, {A=1}, {B=2}})).to_equal(list('-DC=3', '-DA', '-DB=2'))

  - it merges several tables of defines in order, skipping nils: |
      expect(defines(OrderedMap {{B=2}, {A=1}}, nil, OrderedMap {{C=1}})).to_equal(list('-DB=2', '-DA', '-DC'))

  - it lets a later table redefine a macro, where it was first defined: |
      expect(defines(OrderedMap {{A=1}, {B=2}}, OrderedMap {{C=3}, {A=4}})).
         to_equal(list('-DA=4', '-DB=2', '-DC=3'))

- describe c_modules:
  - it lists them in the order written: |
      expect(compile.c_modules(OrderedMap {
         {['posix.unistd'] = {sources={'ext/posix/unistd.c'}}},
         {['posix.ctype'] = {sources={'ext/posix/ctype.c'}}},
         {['posix.fcntl'] = {sources={'ext/posix/fcntl.c'}}},
         {['posix.dirent'] = {sources={'ext/posix/dirent.c'}}},
      })).to_equal(list('posix.unistd', 'posix.ctype', 'posix.fcntl', 'posix.dirent'))
  - it lists only modules built from C sources:
      expect(compile.c_modules(OrderedMap {
         {['posix.unistd'] = {sources={'ext/posix/unistd.c'}}},
         {['posix.version'] = {sources={'lib/posix/version.lua.in'}}},
      })).to_equal(list('posix.unistd'))

- describe spawn:
  - before:
      env = E.mkenv({}, E.DEFAULTENV, E.SHELLENV)

  - it returns the exit status, error output and output of a command: |
      expect(list(compile.spawn(env, '(echo out; echo err >&2; exit 3)'))).
         to_equal(list(3, 'err\n', 'out\n'))

  - it interpolates environment variables into the command:
      env = E.mkenv({GREETING='hello'}, E.DEFAULTENV, E.SHELLENV)
      expect(list(compile.spawn(env, 'echo', '$GREETING'))).to_equal(list(0, '', 'hello\n'))

- describe run:
  - before:
      env = E.mkenv({}, E.DEFAULTENV, E.SHELLENV)

  - it writes the command, and returns its status and output:
      L = {spawn = compile.spawn, write = Stub()}
      expect(list(compile.run(L, env, {'echo', 'hello'}))).to_equal(list(0, 'hello\n', ''))
      expect(L.write).to_contain 'echo hello'

  - it runs the command with L.spawn:
      L = {spawn = function() return 0, '', '' end, write = Stub()}
      expect(list(compile.run(L, env, {'false'}))).to_equal(list(0, '', ''))
      expect(L.write).to_contain 'false'

  - it reports the error output of a failing command: |
      p = capture(function(L, env)
         return require 'luke.compile'.run(L, env, {'(echo oops >&2; false)'})
      end, {spawn = compile.spawn, write = Stub()}, env)
      expect(p).to_fail_with 'oops\n'

  - it ends the error output of a failing command with a newline: |
      p = capture(function(L, env)
         return require 'luke.compile'.run(L, env, {'(printf oops >&2; false)'})
      end, {spawn = compile.spawn, write = Stub()}, env)
      expect(p).to_fail_with 'oops\n'

  - it writes no error output for a failing command without any: |
      p = capture(function(L, env)
         return require 'luke.compile'.run(L, env, {'false'})
      end, {spawn = compile.spawn, write = Stub()}, env)
      expect(p).to_fail_with ''

  - it writes a failing command even when quiet: |
      p = capture(function(env)
         local nop = require 'std.functional.init'.nop
         local compile = require 'luke.compile'
         return compile.run({spawn = compile.spawn, write = nop, quiet = true}, env, {'false'})
      end, env)
      expect(p).to_exit(1)
      expect(p).to_output 'false\n'

- describe install_modules:
  - before:
      dest = tmpdir()
      env = E.mkenv({INST_LUADIR=dest .. '/share', INST_LIBDIR=dest .. '/lib'}, E.DEFAULTENV, E.SHELLENV)
      luke = {variables = {objdir = dest .. '/obj'}}
      L = {spawn = compile.spawn, write = function() end}

  - after:
      os.execute("rm -rf '" .. dest .. "'")

  - it installs Lua modules beneath INST_LUADIR:
      expect(compile.install_modules(L, env, luke, OrderedMap {
         {['type.path'] = {sources={'lib/type/path.lua'}}},
         {['luke'] = {sources={'lib/luke/init.lua'}}},
      })).to_be(0)
      expect(slurp(dest .. '/share/type/path.lua')).to_be(slurp 'lib/type/path.lua')
      expect(slurp(dest .. '/share/luke/init.lua')).to_be(slurp 'lib/luke/init.lua')

  - it installs modules in the order written: |
      written = {}
      L = {spawn = compile.spawn, write = function(s) written[#written + 1] = s end}
      expect(compile.install_modules(L, env, luke, OrderedMap {
         {['type.path'] = {sources={'lib/type/path.lua'}}},
         {['luke'] = {sources={'lib/luke/init.lua'}}},
         {['luke.cli'] = {sources={'lib/luke/cli.lua'}}},
      })).to_be(0)
      installed = {}
      for _, s in ipairs(written) do
         installed[#installed + 1] = s:match '^cp (%S+)'
      end
      expect(plain(installed)).to_equal {'lib/type/path.lua', 'lib/luke/init.lua', 'lib/luke/cli.lua'}

  - it installs built C modules beneath INST_LIBDIR:
      os.execute("mkdir -p '" .. dest .. "/obj' && echo built > '" .. dest .. "/obj/foo.so'")
      expect(compile.install_modules(L, env, luke, OrderedMap {
         {foo = {sources={'ext/foo.c'}}},
      })).to_be(0)
      expect(slurp(dest .. '/lib/foo.so')).to_be 'built\n'

  - it returns the first failing status: |
      expect(capture(function(...)
         return require 'luke.compile'.install_modules(...)
      end, L, env, luke, OrderedMap {
         {['no.such'] = {sources={'lib/no/such.lua'}}},
      })).to_fail_while_containing 'lib/no/such.lua'

  - it diagnoses unsupported source types: |
      expect(capture(function(...)
         return require 'luke.compile'.install_modules(...)
      end, L, env, luke, OrderedMap {{foo = {sources={'foo.txt'}}}})).
         to_fail_with "luke: fatal: unsupported source type 'foo.txt'\n"

- describe script_target:
  - it is the script beside its source without any .in suffix:
      expect(compile.script_target('foo', 'bin/foo.in', 'obj', true)).to_be 'bin/foo'
  - it is the name of a program that is not installed:
      expect(compile.script_target('foo', {}, 'obj', false)).to_be 'foo'
  - it is beneath the objdir for a program that is installed:
      expect(compile.script_target('foo', {}, 'obj', true)).to_be 'obj/foo'

- describe build_c_module:
  - before:
      env = E.mkenv({CC='cc', MAKEDIRS='mkdir -p'}, E.DEFAULTENV, E.SHELLENV)
      luke = {variables = {objdir = 'obj'}, modules = OrderedMap {{foo = {sources = {'ext/foo.c'}}}}}

  - it makes the directory, and then compiles and links: |
      calls = {}
      L = {
         spawn = function(env, ...)
            calls[#calls + 1] = table.concat({...}, ' ')
            return 0, '', ''
         end,
         write = Stub(),
      }
      expect(compile.build_c_module(L, env, luke, 'foo')).to_be(0)
      expect(#calls).to_be(2)
      expect(calls[1]).to_be '$MAKEDIRS obj'
      expect(calls[2]).to_contain 'ext/foo.c -o obj/foo.$LIB_EXTENSION'

  - it returns the status of failing to make the directory: |
      expect(capture(function(L, env, luke)
         print(require 'luke.compile'.build_c_module(L, env, luke, 'foo'))
      end, {spawn = function() return 3, 'boom', '' end, write = function() end}, env, luke)).
         to_succeed_with '$MAKEDIRS obj\n3\n'

- describe build_program:
  - before:
      env = E.mkenv({CC='cc', MAKEDIRS='mkdir -p'}, E.DEFAULTENV, E.SHELLENV)
      luke = {variables = {objdir = 'obj'}}

  - it makes the directory of a target beneath one, and then builds: |
      calls = {}
      L = {
         spawn = function(env, ...)
            calls[#calls + 1] = table.concat({...}, ' ')
            return 0, '', ''
         end,
         write = Stub(),
      }
      expect((compile.build_program(L, env, luke, {}, 'obj/foo', {'foo.c'}))).to_be(0)
      expect(calls[1]).to_be '$MAKEDIRS obj'
      expect(calls[2]).to_contain 'foo.c -o obj/foo'

  - it does not make a directory for a target in the current one:
      calls = {}
      L = {
         spawn = function(env, ...)
            calls[#calls + 1] = table.concat({...}, ' ')
            return 0, '', ''
         end,
         write = Stub(),
      }
      expect((compile.build_program(L, env, luke, {}, 'foo', {'foo.c'}))).to_be(0)
      expect(#calls).to_be(1)

  - it exports the variables of a command in sorted order:
      calls = {}
      L = {
         spawn = function(env, ...)
            calls[#calls + 1] = table.concat({...}, ' ')
            return 0, '', ''
         end,
         write = Stub(),
      }
      rules = {command = {'gen', '$target'}, env = {B = 'b', A = 'a'}}
      expect((compile.build_program(L, env, luke, rules, 'foo', {'foo.in'}))).to_be(0)
      expect(calls[1]).to_be 'export A=a B=b ; gen $target'

  - it returns the status of failing to make the directory: |
      expect(capture(function(L, env, luke)
         print(require 'luke.compile'.build_program(L, env, luke, {}, 'obj/foo', {'foo.c'}))
      end, {spawn = function() return 3, 'boom', '' end, write = function() end}, env, luke)).
         to_succeed_with '$MAKEDIRS obj\n3\n'

- describe install_scripts:
  - before:
      dest = tmpdir()
      env = E.mkenv({INST_BINDIR=dest .. '/bin'}, E.DEFAULTENV, E.SHELLENV)
      luke = {
         variables = {objdir = 'obj'},
         install = {bin = OrderedMap {{foo = 'bin/foo.in'}, {bar = 'bin/bar.in'}}},
      }

  - it installs nothing without scripts:
      expect(compile.install_scripts({}, env, luke, {})).to_be(0)

  - it makes the directory, and then installs and makes each executable: |
      written = {}
      L = {
         spawn = function() return 0, '', '' end,
         write = function(s) written[#written + 1] = s end,
      }
      expect(compile.install_scripts(L, env, luke, {'foo', 'bar'})).to_be(0)
      commands = {}
      for _, s in ipairs(written) do
         if s ~= '\n' then commands[#commands + 1] = s end
      end
      expect(plain(commands)).to_equal {
         'mkdir -p ' .. dest .. '/bin',
         'cp bin/foo ' .. dest .. '/bin/foo',
         'chmod +x ' .. dest .. '/bin/foo',
         'cp bin/bar ' .. dest .. '/bin/bar',
         'chmod +x ' .. dest .. '/bin/bar',
      }

  - it stops at the first failure: |
      expect(capture(function(L, env, luke)
         calls = {}
         L.spawn = function(env, ...)
            calls[#calls + 1] = table.concat({...}, ' ')
            return #calls == 2 and 5 or 0, '', ''
         end
         print(require 'luke.compile'.install_scripts(L, env, luke, {'foo', 'bar'}), #calls)
      end, {write = function() end}, env, luke)).to_succeed_with '5\t2\n'
